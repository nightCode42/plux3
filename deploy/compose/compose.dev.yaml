# Development overlay for `make dev` (DEP-020): Compose Watch rebuilds and
# restarts plux-server whenever Go code under backend/ changes. The starter
# app runs outside Compose under `flutter run`, with Flutter's hot reload
# (`make dev`, `make dev-app`); Studio joins with its own watcher in P11.
services:
  plux-server:
    environment:
      PLUX_OBSERVABILITY_LOG_LEVEL: debug
    develop:
      watch:
        - action: rebuild
          path: ../../backend
          ignore: ["**/*_test.go", "**/coverage.out"]
