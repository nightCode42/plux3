# A test scenario of the starter app (TST-001): plux test runs it headlessly
# on the real runtime.
schemaVersion: 1.0.0
kind: scenarios
scenarios:
  - name: opening the host's profile from a place
    description: The place page hands its parameter to the host's profile route and leaves exposed state alone.
    page: place
    given:
      params:
        name: Harbour
      state:
        counter: 3
    steps:
      - tap: place-profile
    expect:
      - navigatedTo: profile
      - stateEquals:
          counter: 3
