syntax = "proto3";

package plux.v1;

import "google/protobuf/timestamp.proto";
import "plux/v1/common.proto";

option go_package = "github.com/nightCode42/plux3/backend/internal/pluxv1;pluxv1";

// PluginService manages plugins and their editing locks (SRV-040–SRV-042).
// App-level documents share one lock of their own, addressed by app_id with
// an empty plugin_id.
service PluginService {
  rpc CreatePlugin(CreatePluginRequest) returns (CreatePluginResponse) {}
  rpc GetPlugin(GetPluginRequest) returns (GetPluginResponse) {}
  rpc ListPlugins(ListPluginsRequest) returns (ListPluginsResponse) {}
  rpc UpdatePlugin(UpdatePluginRequest) returns (UpdatePluginResponse) {}
  rpc DeletePlugin(DeletePluginRequest) returns (DeletePluginResponse) {}

  // AcquireLock takes the editing lock. It fails with PLX-8020 when
  // someone else holds it and force is not set (SRV-040).
  rpc AcquireLock(AcquireLockRequest) returns (AcquireLockResponse) {}
  // RenewLock is the 30-second heartbeat; a lock expires 2 minutes after
  // the last one (SRV-040).
  rpc RenewLock(RenewLockRequest) returns (RenewLockResponse) {}
  rpc ReleaseLock(ReleaseLockRequest) returns (ReleaseLockResponse) {}
  // RequestLock notifies the holder that someone else wants it (SRV-041).
  rpc RequestLock(RequestLockRequest) returns (RequestLockResponse) {}
  rpc GetLock(GetLockRequest) returns (GetLockResponse) {}

  rpc ListPluginLimits(ListPluginLimitsRequest) returns (ListPluginLimitsResponse) {}
  rpc SetPluginLimit(SetPluginLimitRequest) returns (SetPluginLimitResponse) {}
}

message Plugin {
  string id = 1;
  string app_id = 2;
  string key = 3;
  string name = 4;
  // latest_version is the highest published version, zero when none.
  int64 latest_version = 5;
  // draft_revision is the plugin draft's current revision (SRV-030).
  int64 draft_revision = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// Lock is an exclusive editing lock (SRV-040, ADR-0015).
message Lock {
  // plugin_id is empty for the app-level lock (SRV-042).
  string plugin_id = 1;
  string app_id = 2;
  Actor holder = 3;
  // session identifies the holder's editing session.
  string session = 4;
  google.protobuf.Timestamp acquired_at = 5;
  google.protobuf.Timestamp expires_at = 6;
  // requested_by lists users who asked for the lock since it was taken.
  repeated Actor requested_by = 7;
}

message CreatePluginRequest {
  string app_id = 1;
  string key = 2;
  string name = 3;
}
message CreatePluginResponse {
  Plugin plugin = 1;
}

message GetPluginRequest {
  string id = 1;
}
message GetPluginResponse {
  Plugin plugin = 1;
}

message ListPluginsRequest {
  string app_id = 1;
  Page page = 2;
}
message ListPluginsResponse {
  repeated Plugin plugins = 1;
  PageResult page = 2;
}

message UpdatePluginRequest {
  string id = 1;
  string name = 2;
}
message UpdatePluginResponse {
  Plugin plugin = 1;
}

message DeletePluginRequest {
  string id = 1;
}
message DeletePluginResponse {
  TrashItem trash = 1;
}

message AcquireLockRequest {
  string app_id = 1;
  string plugin_id = 2;
  string session = 3;
  // force takes the lock from its holder; it needs plugin.lock.override,
  // snapshots the holder's unsaved work and is audited (SRV-041).
  bool force = 4;
}
message AcquireLockResponse {
  Lock lock = 1;
  // preserved_snapshot_id is set when force took the lock.
  string preserved_snapshot_id = 2;
}

message RenewLockRequest {
  string app_id = 1;
  string plugin_id = 2;
  string session = 3;
}
message RenewLockResponse {
  Lock lock = 1;
}

message ReleaseLockRequest {
  string app_id = 1;
  string plugin_id = 2;
  string session = 3;
}
message ReleaseLockResponse {}

message RequestLockRequest {
  string app_id = 1;
  string plugin_id = 2;
}
message RequestLockResponse {
  Lock lock = 1;
}

message GetLockRequest {
  string app_id = 1;
  string plugin_id = 2;
}
message GetLockResponse {
  Lock lock = 1;
}

message ListPluginLimitsRequest {
  string plugin_id = 1;
}
message ListPluginLimitsResponse {
  repeated LimitUsage limits = 1;
}

message SetPluginLimitRequest {
  string plugin_id = 1;
  string key = 2;
  int64 value = 3;
}
message SetPluginLimitResponse {
  LimitUsage limit = 1;
}
