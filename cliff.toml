# git-cliff configuration: release notes per component from Conventional
# Commits (CI-008). Used by `make release-notes` and .github/workflows/release.yml.
# Components are tagged `<component>/v<semver>`, e.g. `backend/v0.1.0`.
# Every release note ends with an "Upgrading" section (DEP-030): the standard
# steps, then each step a commit declares in an `Upgrade:` footer and each
# breaking change.

[changelog]
header = ""
body = """
{% if version %}\
## {{ version | split(pat="/v") | last }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% if commit.breaking %} — **breaking**{% endif %} ({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}
### Upgrading
{% set component = get_env(name="COMPONENT", default="backend") %}
{% if component == "plux_flutter" or component == "plux_devtools" %}\
Raise the `{{ component }}` constraint in the host app's `pubspec.yaml` and run \
`flutter pub upgrade {{ component }}`. Within a major version the public API \
changes only additively (RT-001), and the runtime reads every bundle an \
earlier compiler wrote (BND-000).
{% else %}\
Upgrade from the previous minor version (N-1) by replacing the binaries or \
images one replica at a time; migrations run automatically and are \
expand-only, so the old version keeps working during the roll (DEP-030).
{% endif %}\
{% for commit in commits %}{% for footer in commit.footers %}\
{% if footer.token == "Upgrade" or footer.breaking %}
- {{ footer.value | upper_first }} ({{ commit.id | truncate(length=7, end="") }})\
{% endif %}{% endfor %}{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^(build|ci)", group = "<!-- 6 -->Build and CI" },
  { message = "^chore\\(deps\\)", group = "<!-- 7 -->Dependencies" },
  { message = "^(chore|style|revert)", skip = true },
]
