# Dart pub workspace for every Dart and Flutter package in the monorepo.
# Members declare `resolution: workspace`; one lockfile covers them all.
name: plux_workspace
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - apps/add_to_app/plux_module
  - apps/starter
  - packages/plux_auto_route
  - packages/plux_devtools
  - packages/plux_flutter
  - packages/plux_go_router
  - packages/plux_location
  - packages/plux_lottie
  - packages/plux_media
  - packages/plux_native_scan
  - packages/plux_rive
  - packages/plux_scanner
  - packages/plux_widget_api
  - test/bench/runtime
  - test/size/blank
  - test/size/plux
