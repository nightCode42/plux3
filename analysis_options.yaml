# Shared analysis options for every Dart and Flutter package in the workspace.
# Standards: docs/engineering/dart-standards.md.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error
    invalid_annotation_target: error
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/build/**"

linter:
  rules:
    # Documentation: every public API is documented (RT-001).
    - public_member_api_docs
    - package_prefixed_library_names
    # Correctness.
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - discarded_futures
    - only_throw_errors
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_statements
    # Clarity.
    - always_use_package_imports
    - directives_ordering
    - prefer_final_fields
    - prefer_final_locals
    - prefer_single_quotes
    - sort_pub_dependencies
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - use_named_constants
