# .pre-commit-config.yaml — git hooks for Plux. Docs: https://pre-commit.com
#
# Install: make setup (or: make hooks-install)
# Run all: pre-commit run --all-files
#
# Stages:
#   pre-commit  fast checks on every commit: hygiene, secrets, formatting,
#               specification consistency
#   commit-msg  Conventional Commits
#   pre-push    Go unit tests
#
# Language hooks call the Makefile, so hooks, CI and local runs share one
# definition of each check (docs/engineering/workflow.md §7).

default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  # ── File hygiene ─────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # flatc's Dart output is checked by regeneration (make gen-check), and
      # vendored zstd and icon font licences by their import scripts
      # (ADR-0030, ADR-0032), as they are.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: '(_generated\.dart|^packages/plux_flutter/native/zstd/.*|^backend/internal/icons/fonts/LICENSE-.*)$'
      - id: end-of-file-fixer
        exclude: '(_generated\.dart|^packages/plux_flutter/native/zstd/.*|^backend/internal/icons/fonts/LICENSE-.*)$'
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
        # The WebAssembly image codecs are pinned by codecs.lock and rebuilt
        # by `make wasm-codecs-check` (ADR-0027); maintainer-approved
        # exception, 2026-09-28.
        # The Material Symbols variable font the server subsets is pinned by
        # icons.lock (ADR-0032 § Icons, option (a)); server-only, devices get
        # per-bundle subsets; maintainer-approved exception, 2026-09-29.
        exclude: ^(backend/internal/compiler/media/codecs/[a-z]+\.wasm|backend/internal/icons/fonts/MaterialSymbolsOutlined\.ttf)$
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch=main]

  # ── Secret scanning ──────────────────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: [--config=.gitleaks.toml]

  # ── Toolchains (pinned tools from `make setup`) ──────────────────────────
  - repo: local
    hooks:
      - id: go-fmt
        name: go format (gofumpt, goimports)
        language: system
        entry: make -s go-fmt
        files: \.go$
        pass_filenames: false

      - id: dart-format
        name: dart format
        language: system
        entry: dart format
        types: [dart]
        # Generated code is checked by regeneration (make gen-check), not formatted.
        exclude: '(\.g|_generated)\.dart$'

      - id: studio-format
        name: biome (Studio)
        language: system
        entry: make -s studio-fmt
        files: ^studio/.*\.(ts|tsx|js|json|jsonc)$
        pass_filenames: false

      - id: spec-lint
        name: specification consistency
        language: system
        entry: make -s spec-lint
        files: ^docs/requirements\.md$
        pass_filenames: false

      - id: go-test
        name: go test
        language: system
        entry: make -s go-test
        files: \.go$
        pass_filenames: false
        stages: [pre-push]

      - id: conventional-commit-msg
        name: conventional commit message
        language: script
        entry: scripts/check-commit-msg.sh
        stages: [commit-msg]
