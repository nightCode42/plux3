          type: array
          items:
            $ref: '#/components/schemas/plux.v1.Diagnostic'
          title: diagnostics
      title: InstantiateResponse
      additionalProperties: false
    plux.v1.IosEvidence:
      type: object
      properties:
        appAttestKeyId:
          type: string
          title: app_attest_key_id
          format: byte
          description: app_attest_key_id is the App Attest key identifier.
        attestationObject:
          type: string
          title: attestation_object
          format: byte
          description: |-
            attestation_object is the CBOR attestation object App Attest
             returned for the challenge.
      title: IosEvidence
      additionalProperties: false
      description: IosEvidence is the proof an iOS device offers (SEC-003).
    plux.v1.IssueDeviceTokenRequest:
      type: object
      properties:
        deviceId:
          type: string
          title: device_id
        deviceSecret:
          type: string
          title: device_secret
          description: device_secret is the credential RegisterDevice returned.
      title: IssueDeviceTokenRequest
      additionalProperties: false
    plux.v1.IssueDeviceTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          title: access_token
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: expires_at
        tokenType:
          type: string
          title: token_type
          description: |-
            token_type is "DPoP": the token is bound to the device's key and is
             sent as `Authorization: DPoP <token>` with a proof (SEC-020).
      title: IssueDeviceTokenResponse
      additionalProperties: false
    plux.v1.KeyStorage:
      type: string
      title: KeyStorage
      enum:
        - KEY_STORAGE_UNSPECIFIED
        - KEY_STORAGE_SOFTWARE
        - KEY_STORAGE_TEE
        - KEY_STORAGE_STRONGBOX
        - KEY_STORAGE_SECURE_ENCLAVE
      description: KeyStorage says where a device key is held (SEC-002).
    plux.v1.LimitUsage:
      type: object
      properties:
        key:
          type: string
          title: key
          description: key is the limit's registry key, such as "bundle.pluginSize".
        unit:
          type: string
          title: unit
        scope:
          type: string
          title: scope
          description: scope is "installation", "organization", "app" or "plugin".
        value:
          type: string
          title: value
          format: int64
        effective:
          type: string
          title: effective
          format: int64
          description: effective is the limit in force here after the hierarchy is resolved.
        hardMax:
          type: string
          title: hard_max
          format: int64
          description: hard_max is the value no scope may exceed.
        warning:
          type: boolean
          title: warning
          description: warning is true once usage reaches 80% of effective (LIM-003).
      title: LimitUsage
      additionalProperties: false
      description: LimitUsage is the current usage of one limit at one scope (LIM-005).
