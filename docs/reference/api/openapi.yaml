      title: ListWorkloadIdentitiesResponse
      additionalProperties: false
    plux.v1.Location:
      type: object
      properties:
        file:
          type: string
          title: file
          description: file is the document's path in the project layout, with forward slashes.
        path:
          type: string
          title: path
          description: path is a JSON Pointer (RFC 6901) into the document.
        range:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Range'
          title: range
          description: range narrows the location to characters inside a PXL expression.
      title: Location
      additionalProperties: false
      description: Location identifies a value inside a project.
    plux.v1.Lock:
      type: object
      properties:
        pluginId:
          type: string
          title: plugin_id
          description: plugin_id is empty for the app-level lock (SRV-042).
        appId:
          type: string
          title: app_id
        holder:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Actor'
          title: holder
        session:
          type: string
          title: session
          description: session identifies the holder's editing session.
        acquiredAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: acquired_at
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: expires_at
        requestedBy:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.Actor'
          title: requested_by
          description: requested_by lists users who asked for the lock since it was taken.
      title: Lock
      additionalProperties: false
      description: Lock is an exclusive editing lock (SRV-040, ADR-0015).
    plux.v1.LogoutRequest:
      type: object
      title: LogoutRequest
      additionalProperties: false
    plux.v1.LogoutResponse:
      type: object
      title: LogoutResponse
      additionalProperties: false
    plux.v1.Manifest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        environment:
          type: string
          title: environment
        channel:
          type: string
          title: channel
        releaseSequence:
          type: string
          title: release_sequence
          format: int64
        issuedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: issued_at
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: expires_at
        appBundle:
          allOf:
            - $ref: '#/components/schemas/plux.v1.BundleDescriptor'
          title: app_bundle
        plugins:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.PluginDescriptor'
          title: plugins
        control:
          allOf:
            - $ref: '#/components/schemas/plux.v1.ControlFlags'
          title: control
        experiments:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.ExperimentAssignment'
          title: experiments
          description: |-
            experiments are the variant assignments the device needs; empty
             until experiments arrive (ABT-001).
        signed:
          type: string
          title: signed
          format: byte
          description: signed is the canonical JSON the signatures cover.
        signatures:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.Signature'
          title: signatures
          description: |-
            signatures sign `signed`. There may be several, so that keys can be
             rotated and thresholds applied (ADR-0004).
        config:
          allOf:
            - $ref: '#/components/schemas/plux.v1.SecurityConfigRef'
          title: config
          description: |-
            config is the security configuration this release requires; it is
             part of the signed document (SEC-182).
        metadata:
          allOf:
            - $ref: '#/components/schemas/plux.v1.UpdateMetadataRef'
          title: metadata
          description: |-
            metadata names the update-metadata versions the manifest belongs to,
             for rollback and freeze checks; part of the signed document
             (SEC-050).
      title: Manifest
      additionalProperties: false
      description: |-
        Manifest describes one release as a device sees it (REL-030,
         Appendix B.3). The signatures cover `signed`, the RFC 8785 canonical
         JSON of the document's signed part, not this message: a device
         verifies the bytes it received rather than a re-encoding.
    plux.v1.Member:
      type: object
      properties:
        userId:
          type: string
          title: user_id
        organizationId:
          type: string
          title: organization_id
        teamId:
          type: string
          title: team_id
          description: team_id is empty for a direct organization membership.
        role:
          type: string
          title: role
          description: |-
            role is "owner", "admin", "developer" or "viewer" for a direct
             membership (SEC-102), and "member" for a team membership: a team's
             members hold the roles the team is granted on apps (GOV-001).
        addedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: added_at
        displayName:
          type: string
          title: display_name
        email:
          type: string
          title: email
      title: Member
      additionalProperties: false
      description: Member binds a user to an organization or a team with a role.
    plux.v1.MfaChallenge:
      type: object
      properties:
        id:
          type: string
          title: id
        kinds:
          type: array
          items:
            type: string
          title: kinds
          description: kinds lists the factor kinds the user may answer with.
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: expires_at
      title: MfaChallenge
      additionalProperties: false
      description: MfaChallenge is a sign-in waiting for its second factor.
    plux.v1.Organization:
      type: object
      properties:
        id:
          type: string
          title: id
        key:
          type: string
          title: key
          description: key is the stable, URL-safe identifier, unique per installation.
        name:
          type: string
          title: name
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
      title: Organization
      additionalProperties: false
    plux.v1.Page:
      type: object
      properties:
        pageSize:
          type: integer
          title: page_size
          format: int32
          description: page_size is the maximum number of items to return.
        pageToken:
          type: string
          title: page_token
          description: |-
            page_token continues an earlier call. Tokens are opaque and
             integrity-protected; they are bound to the filter and ordering they
             were issued for and are rejected by any other query.
        filter:
          type: string
          title: filter
          description: filter selects items with the documented filter syntax of the endpoint.
        orderBy:
          type: string
          title: order_by
          description: order_by names fields to sort by, each optionally followed by " desc".
        readMask:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.FieldMask'
          title: read_mask
          description: |-
            read_mask limits each returned item to the named fields; an empty
             mask returns whole items.
      title: Page
      additionalProperties: false
      description: |-
        Page asks for one page of a list endpoint (SRV-004). No list endpoint
         returns an unbounded result: an unset page_size uses the server default
         and any value above the maximum is clamped to it.
    plux.v1.PageResult:
      type: object
      properties:
        nextPageToken:
          type: string
          title: next_page_token
          description: next_page_token is empty on the last page.
        totalSize:
          type: integer
          title: total_size
          format: int32
          description: |-
            total_size is the number of items matching the filter, when the
             endpoint can count them cheaply; zero otherwise.
      title: PageResult
      additionalProperties: false
      description: PageResult carries the continuation of a list response.
    plux.v1.PatchDocumentRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        pluginId:
          type: string
          title: plugin_id
        path:
          type: string
          title: path
        patch:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.PatchOp'
          title: patch
        ifRevision:
          type: string
          title: if_revision
          format: int64
        session:
          type: string
          title: session
      title: PatchDocumentRequest
      additionalProperties: false
    plux.v1.PatchDocumentResponse:
      type: object
      properties:
        document:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Document'
          title: document
        snapshotId:
          type: string
          title: snapshot_id
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.Diagnostic'
          title: diagnostics
      title: PatchDocumentResponse
      additionalProperties: false
    plux.v1.PatchOp:
      type: object
      properties:
        op:
          type: string
          title: op
          description: op is "add", "remove", "replace", "move", "copy" or "test".
        path:
          type: string
          title: path
        from:
          type: string
          title: from
        value:
          type: string
          title: value
          format: byte
          description: |-
            value is the JSON value of "add", "replace" and "test", as bytes, so
             that it keeps the canonical form the document model defines.
      title: PatchOp
      additionalProperties: false
      description: PatchOp is one JSON Patch (RFC 6902) operation.
    plux.v1.Plugin:
      type: object
      properties:
        id:
          type: string
          title: id
        appId:
          type: string
          title: app_id
        key:
          type: string
          title: key
        name:
          type: string
          title: name
        latestVersion:
          type: string
          title: latest_version
          format: int64
          description: latest_version is the highest published version, zero when none.
        draftRevision:
          type: string
          title: draft_revision
          format: int64
          description: draft_revision is the plugin draft's current revision (SRV-030).
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
      title: Plugin
      additionalProperties: false
    plux.v1.PluginDescriptor:
      type: object
      properties:
        key:
          type: string
          title: key
        version:
          type: string
          title: version
          format: int64
        bundle:
          allOf:
            - $ref: '#/components/schemas/plux.v1.BundleDescriptor'
          title: bundle
      title: PluginDescriptor
      additionalProperties: false
    plux.v1.PluginVersion:
      type: object
      properties:
        id:
          type: string
          title: id
        pluginId:
          type: string
          title: plugin_id
        pluginKey:
          type: string
          title: plugin_key
        version:
          type: string
          title: version
          format: int64
        label:
          type: string
          title: label
        notes:
          type: string
          title: notes
        bundleSha256:
          type: string
          title: bundle_sha256
          description: bundle_sha256 is the bundle hash the signature covers (BND-005).
        bundleSize:
          type: string
          title: bundle_size
          format: int64
        requiredFeatures:
          type: array
          items:
            type: string
          title: required_features
        minRuntime:
          type: string
          title: min_runtime
        signature:
          type: string
          title: signature
          format: byte
          description: signature and key_id record how the version was signed (SRV-052).
        keyId:
          type: string
          title: key_id
        algorithm:
          type: string
          title: algorithm
        sourceSnapshotId:
          type: string
          title: source_snapshot_id
          description: source_snapshot_id is the draft snapshot this was compiled from.
        publishedBy:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Actor'
          title: published_by
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
      title: PluginVersion
      additionalProperties: false
      description: PluginVersion is an immutable published plugin (REL-001).
    plux.v1.PollDeviceAuthorizationRequest:
      type: object
      properties:
        deviceCode:
          type: string
          title: device_code
      title: PollDeviceAuthorizationRequest
      additionalProperties: false
    plux.v1.PollDeviceAuthorizationResponse:
      type: object
      properties:
        status:
          type: string
          title: status
          description: status is "pending", "slow_down", "approved" or "denied".
        token:
          allOf:
            - $ref: '#/components/schemas/plux.v1.AccessToken'
          title: token
        secret:
          type: string
          title: secret
          description: |-
            secret is the token's value, returned exactly once, on the first
             poll after approval.
      title: PollDeviceAuthorizationResponse
      additionalProperties: false
    plux.v1.PromoteReleaseRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        sequence:
          type: string
          title: sequence
          format: int64
        environmentId:
          type: string
          title: environment_id
        channelKey:
          type: string
          title: channel_key
      title: PromoteReleaseRequest
      additionalProperties: false
    plux.v1.PromoteReleaseResponse:
      type: object
      properties:
        release:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Release'
          title: release
      title: PromoteReleaseResponse
      additionalProperties: false
    plux.v1.PublicKey:
      type: object
      properties:
        keyId:
          type: string
          title: key_id
        algorithm:
          type: string
          title: algorithm
        publicKey:
          type: string
          title: public_key
          format: byte
          description: public_key is the raw key; an Ed25519 key is 32 bytes.
        role:
          type: string
          title: role
          description: role is the update-metadata role this key holds (ADR-0004).
      title: PublicKey
      additionalProperties: false
    plux.v1.PublishJob:
      type: object
      properties:
        id:
          type: string
          title: id
        appId:
          type: string
          title: app_id
        pluginId:
          type: string
          title: plugin_id
        environmentId:
          type: string
          title: environment_id
        revision:
          type: string
          title: revision
          format: int64
          description: revision is the draft revision the job froze.
        state:
          type: string
          title: state
          description: state is "queued", "running", "succeeded", "failed" or "cancelled".
        stage:
          type: string
          title: stage
          description: stage is the pipeline stage currently running (CMP-003).
        percent:
          type: integer
          title: percent
          format: int32
        version:
          type: string
          title: version
          format: int64
          description: version is the plugin version created, once the job succeeds.
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.Diagnostic'
          title: diagnostics
        actor:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Actor'
          title: actor
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        finishedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: finished_at
      title: PublishJob
      additionalProperties: false
    plux.v1.PublishRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        pluginId:
          type: string
          title: plugin_id
        environmentId:
          type: string
          title: environment_id
        revision:
          type: string
          title: revision
          format: int64
          description: revision freezes a specific draft revision; zero uses the current one.
        label:
          type: string
          title: label
        notes:
          type: string
          title: notes
        acknowledgeWarnings:
          type: boolean
          title: acknowledge_warnings
          description: |-
            acknowledge_warnings publishes despite warnings; without it a warning
             that policy does not allow stops the publish (SRV-051).
      title: PublishRequest
      additionalProperties: false
    plux.v1.PublishResponse:
      type: object
      properties:
        job:
          allOf:
            - $ref: '#/components/schemas/plux.v1.PublishJob'
          title: job
      title: PublishResponse
      additionalProperties: false
    plux.v1.PurgeFromTrashRequest:
      type: object
      properties:
        id:
          type: string
          title: id
      title: PurgeFromTrashRequest
      additionalProperties: false
    plux.v1.PurgeFromTrashResponse:
      type: object
      title: PurgeFromTrashResponse
      additionalProperties: false
    plux.v1.PutDocumentRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        pluginId:
          type: string
          title: plugin_id
        path:
          type: string
          title: path
        content:
          type: string
          title: content
          format: byte
        ifRevision:
          type: string
          title: if_revision
          format: int64
          description: if_revision is the revision the writer last read; zero creates.
        session:
          type: string
          title: session
      title: PutDocumentRequest
      additionalProperties: false
    plux.v1.PutDocumentResponse:
      type: object
      properties:
        document:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Document'
          title: document
        snapshotId:
          type: string
          title: snapshot_id
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.Diagnostic'
          title: diagnostics
      title: PutDocumentResponse
      additionalProperties: false
    plux.v1.Range:
      type: object
      properties:
        start:
          type: integer
          title: start
          format: int32
        end:
          type: integer
          title: end
          format: int32
      title: Range
      additionalProperties: false
      description: Range is a half-open range of Unicode code points inside an expression.
    plux.v1.ReattestDeviceRequest:
      type: object
      properties:
        deviceId:
          type: string
          title: device_id
        challenge:
          type: string
          title: challenge
          format: byte
          description: challenge is a fresh challenge from CreateRegistrationChallenge.
        evidence:
          allOf:
            - $ref: '#/components/schemas/plux.v1.AttestationEvidence'
          title: evidence
          description: |-
            evidence is the new attestation of the device's existing DPoP key
             (SEC-006).
      title: ReattestDeviceRequest
      additionalProperties: false
    plux.v1.ReattestDeviceResponse:
      type: object
      properties:
        device:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Device'
          title: device
      title: ReattestDeviceResponse
      additionalProperties: false
    plux.v1.RefreshDeviceTokenRequest:
      type: object
      anyOf:
        - type: object
          properties:
            appAttestAssertion:
              type: string
              title: app_attest_assertion
              format: byte
              description: app_attest_assertion is the App Attest assertion over the request.
          title: app_attest_assertion
        - type: object
          properties:
            playIntegrityToken:
              type: string
              title: play_integrity_token
              description: play_integrity_token is a Play Integrity verdict token.
          title: play_integrity_token
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - appAttestAssertion
              - required:
                  - playIntegrityToken
          - not:
              oneOf:
                - required:
                    - appAttestAssertion
                - required:
                    - playIntegrityToken
      properties:
        deviceId:
          type: string
          title: device_id
      title: RefreshDeviceTokenRequest
    plux.v1.RefreshDeviceTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          title: access_token
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: expires_at
        tokenType:
          type: string
          title: token_type
          description: token_type is "DPoP" (SEC-020).
      title: RefreshDeviceTokenResponse
      additionalProperties: false
      description: |-
        RefreshDeviceTokenResponse carries the new token; it has the same
         fields as IssueDeviceTokenResponse (SEC-025).
    plux.v1.RegisterAttestedDeviceRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        environment:
          type: string
          title: environment
        platform:
          type: string
          title: platform
        osVersion:
          type: string
          title: os_version
        runtimeVersion:
          type: string
          title: runtime_version
        hostBuild:
          type: string
          title: host_build
        challenge:
          type: string
          title: challenge
          format: byte
          description: |-
            challenge is the value CreateRegistrationChallenge returned; the
             attestation must be bound to it (SEC-005).
        dpopPublicKeyJwk:
          type: string
          title: dpop_public_key_jwk
          format: byte
          description: |-
            dpop_public_key_jwk is the device's DPoP public key as a JSON Web Key
             (RFC 7517) (SEC-001).
        keyStorage:
          allOf:
            - $ref: '#/components/schemas/plux.v1.KeyStorage'
          title: key_storage
          description: |-
            key_storage is where the device claims the key lives; the attestation
             must prove at least that (SEC-002).
        evidence:
          allOf:
            - $ref: '#/components/schemas/plux.v1.AttestationEvidence'
          title: evidence
          description: evidence is the attestation of the DPoP key (SEC-003).
        keyAgreementPublicKeyJwk:
          type: string
          title: key_agreement_public_key_jwk
          format: byte
          description: |-
            key_agreement_public_key_jwk is the device's key-agreement public key
             for sealed payloads, as a JWK; empty when the device has none
             (SEC-053).
        scaPublicKeyJwk:
          type: string
          title: sca_public_key_jwk
          format: byte
          description: |-
            sca_public_key_jwk is the public key that signs transaction
             confirmations, as a JWK; empty when the device has none (SEC-027).
        scaEvidence:
          allOf:
            - $ref: '#/components/schemas/plux.v1.AttestationEvidence'
          title: sca_evidence
          description: |-
            sca_evidence is the attestation of the SCA key, in the same forms as
             evidence; set when sca_public_key_jwk is (SEC-027).
      title: RegisterAttestedDeviceRequest
      additionalProperties: false
    plux.v1.RegisterAttestedDeviceResponse:
      type: object
      properties:
        device:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Device'
          title: device
      title: RegisterAttestedDeviceResponse
      additionalProperties: false
    plux.v1.RegisterDeviceRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        environment:
          type: string
          title: environment
        platform:
          type: string
          title: platform
        osVersion:
          type: string
          title: os_version
        runtimeVersion:
          type: string
          title: runtime_version
        hostBuild:
          type: string
          title: host_build
      title: RegisterDeviceRequest
      additionalProperties: false
    plux.v1.RegisterDeviceResponse:
      type: object
      properties:
        device:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Device'
          title: device
        deviceSecret:
          type: string
          title: device_secret
          description: |-
            device_secret is the device's credential for IssueDeviceToken. It is
             returned exactly once and stored only as a hash.
      title: RegisterDeviceResponse
      additionalProperties: false
    plux.v1.Release:
      type: object
      properties:
        id:
          type: string
          title: id
        appId:
          type: string
          title: app_id
        sequence:
          type: string
          title: sequence
          format: int64
        pluginVersionIds:
          type: array
          items:
            type: string
          title: plugin_version_ids
          description: plugin_version_ids are the versions in this release.
        appBundleSha256:
          type: string
          title: app_bundle_sha256
        appBundleSize:
          type: string
          title: app_bundle_size
          format: int64
        rollbackOf:
          type: string
          title: rollback_of
          format: int64
          description: rollback_of is the sequence this release reproduces, when it is one.
        notes:
          type: string
          title: notes
        createdBy:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Actor'
          title: created_by
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
      title: Release
      additionalProperties: false
      description: |-
        Release is an immutable set of plugin versions plus one app bundle
         (REL-002).
    plux.v1.ReleaseLockRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        pluginId:
          type: string
          title: plugin_id
        session:
          type: string
          title: session
      title: ReleaseLockRequest
      additionalProperties: false
    plux.v1.ReleaseLockResponse:
      type: object
