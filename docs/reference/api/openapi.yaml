          title: message
        cause:
          type: string
          title: cause
        fix:
          type: string
          title: fix
        patch:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.PatchOp'
          title: patch
        docUrl:
          type: string
          title: doc_url
        related:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.Location'
          title: related
      title: Diagnostic
      additionalProperties: false
      description: Diagnostic is a finding about a document (ADR-0018, Appendix F).
    plux.v1.Document:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        pluginId:
          type: string
          title: plugin_id
          description: plugin_id is empty for app-level documents.
        path:
          type: string
          title: path
          description: path is the document's path in the Git layout (SCH-006).
        kind:
          type: string
          title: kind
          description: kind is the document's "kind" field, such as "page" or "theme".
        content:
          type: string
          title: content
          format: byte
          description: content is the canonical JSON of the document (SCH-003).
        sha256:
          type: string
          title: sha256
          description: sha256 is the hash of content, lower-case hex.
        revision:
          type: string
          title: revision
          format: int64
        updatedBy:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Actor'
          title: updated_by
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
      title: Document
      additionalProperties: false
      description: Document is one file of a draft.
    plux.v1.DocumentChange:
      type: object
      properties:
        path:
          type: string
          title: path
        change:
