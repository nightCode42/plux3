          type: string
          title: key
          description: key is "production" by default, plus any others such as "beta".
        releaseSequence:
          type: string
          title: release_sequence
          format: int64
          description: |-
            release_sequence is the release this channel currently serves; zero
             when nothing has been promoted yet.
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
        signedReleaseSequence:
          type: string
