    plux.v1.GetManifestRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        environment:
          type: string
          title: environment
        channel:
          type: string
          title: channel
        installedSequence:
          type: string
          title: installed_sequence
          format: int64
          description: installed_sequence is the release the device runs, zero for none.
        installed:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.InstalledBundle'
          title: installed
          description: installed lists the bundles the device holds.
        ifNoneMatch:
          type: string
          title: if_none_match
          description: if_none_match is the ETag of the manifest the device already has.
        installedDigest:
          type: string
          title: installed_digest
          format: byte
          description: |-
            installed_digest stands for installed on an up-to-date check
             (NFR-006, ADR-0037): the SHA-256 of one line `<key>:<sha256 hex>\n`
             per installed bundle, sorted by key, the app bundle's key empty. A
             device that sends it with if_none_match sends no installed list.
        configVersion:
          type: string
          title: config_version
          format: int64
          description: |-
            config_version is the security configuration version the device
             holds, zero for none (SEC-182).
      title: GetManifestRequest
      additionalProperties: false
    plux.v1.GetManifestResponse:
      type: object
      properties:
        notModified:
          type: boolean
          title: not_modified
          description: not_modified is true when if_none_match matched; manifest is unset.
        manifest:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Manifest'
          title: manifest
        etag:
          type: string
          title: etag
        installedRequired:
          type: boolean
          title: installed_required
          description: |-
            installed_required is true when a request with installed_digest
             found the manifest changed: manifest is unset, and the device asks
             again with installed, from which the server plans its deltas.
        configPatch:
          type: string
          title: config_patch
          format: byte
          description: |-
            config_patch is an RFC 7396 merge patch, as JSON, from the
             configuration version the device sent to the one the manifest names.
             It is outside the signed part: the device verifies the patched
             result against the manifest's config hash (SEC-182).
        configFullRequired:
          type: boolean
          title: config_full_required
          description: |-
            config_full_required is true when no patch can be given, so the
             device fetches the whole configuration (SEC-182).
      title: GetManifestResponse
      additionalProperties: false
