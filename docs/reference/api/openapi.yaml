          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/plux.v1.InstantiateRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/plux.v1.InstantiateResponse'
  /plux.v1.TemplateService/ListTemplates:
    post:
      tags:
        - plux.v1.TemplateService
      summary: ListTemplates
      operationId: plux.v1.TemplateService.ListTemplates
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/plux.v1.ListTemplatesRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/plux.v1.ListTemplatesResponse'
  /plux.v1.TokenService/ExchangeUserToken:
    post:
      tags:
        - plux.v1.TokenService
      summary: ExchangeUserToken
      description: |-
        ExchangeUserToken trades an end-user token for a short-lived token
         scoped to one upstream audience, following RFC 8693 (SEC-026).
      operationId: plux.v1.TokenService.ExchangeUserToken
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/plux.v1.ExchangeUserTokenRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/plux.v1.ExchangeUserTokenResponse'
  /plux.v1.TokenService/IssueDeviceToken:
    post:
      tags:
        - plux.v1.TokenService
      summary: IssueDeviceToken
      operationId: plux.v1.TokenService.IssueDeviceToken
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/plux.v1.IssueDeviceTokenRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/plux.v1.IssueDeviceTokenResponse'
  /plux.v1.TokenService/RefreshDeviceToken:
    post:
      tags:
        - plux.v1.TokenService
      summary: RefreshDeviceToken
      description: |-
        RefreshDeviceToken issues a new token to an attested device (SEC-025).
         The proof of possession of the device key travels in the DPoP header
         (RFC 9449), not in the body. A request without a valid proof is
         answered with the "use_dpop_nonce" error and a DPoP-Nonce header
         to retry with (SEC-024).
      operationId: plux.v1.TokenService.RefreshDeviceToken
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/plux.v1.RefreshDeviceTokenRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/plux.v1.RefreshDeviceTokenResponse'
components:
  schemas:
    connect-protocol-version:
      type: number
      examples:
        - 1
      title: Connect-Protocol-Version
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      examples:
        - 1000
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`.'
        value:
          type: string
          format: binary
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          type: object
          title: Debug
          additionalProperties: true
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
    google.protobuf.FieldMask:
      type: string
      description: Comma-separated field paths in lowerCamelCase (for example, `user.displayName,photo`).
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: A point in time in RFC 3339 format, with up to nanosecond precision. Output uses UTC (`Z`); input may use an offset from UTC.
    plux.v1.AcceptInvitationRequest:
      type: object
      properties:
        invitation:
          type: string
          title: invitation
        displayName:
          type: string
          title: display_name
        password:
          type: string
          title: password
      title: AcceptInvitationRequest
      additionalProperties: false
    plux.v1.AcceptInvitationResponse:
      type: object
      properties:
        user:
          allOf:
            - $ref: '#/components/schemas/plux.v1.User'
          title: user
      title: AcceptInvitationResponse
      additionalProperties: false
    plux.v1.AccessGrant:
      type: object
      properties:
        id:
          type: string
          title: id
        appId:
          type: string
          title: app_id
        teamId:
          type: string
          title: team_id
          description: Exactly one of team_id and user_id is set.
        userId:
          type: string
          title: user_id
        role:
          type: string
          title: role
        grantedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: granted_at
      title: AccessGrant
      additionalProperties: false
      description: AccessGrant is a role on one app held by a team or a user (GOV-001).
    plux.v1.AccessToken:
      type: object
      properties:
        id:
          type: string
          title: id
        name:
          type: string
          title: name
        userId:
          type: string
          title: user_id
          description: user_id is empty for a token exchanged from a CI identity.
        organizationId:
          type: string
          title: organization_id
        scopes:
          type: array
          items:
            type: string
          title: scopes
        prefix:
          type: string
          title: prefix
          description: prefix is the token's visible prefix, for recognising it in a list.
        source:
          type: string
          title: source
          description: source is "pat", "cli" or "ci".
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: expires_at
        lastUsedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: last_used_at
        revokedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: revoked_at
      title: AccessToken
      additionalProperties: false
      description: AccessToken is a scoped, expiring, revocable credential (SRV-064).
    plux.v1.AcquireLockRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        pluginId:
          type: string
          title: plugin_id
        session:
          type: string
          title: session
        force:
          type: boolean
          title: force
          description: |-
            force takes the lock from its holder; it needs plugin.lock.override,
             snapshots the holder's unsaved work and is audited (SRV-041).
      title: AcquireLockRequest
      additionalProperties: false
    plux.v1.AcquireLockResponse:
      type: object
      properties:
        lock:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Lock'
          title: lock
        preservedSnapshotId:
          type: string
          title: preserved_snapshot_id
          description: preserved_snapshot_id is set when force took the lock.
      title: AcquireLockResponse
      additionalProperties: false
    plux.v1.Actor:
      type: object
      properties:
        kind:
          type: string
          title: kind
          description: kind is "user", "token", "device", "system" or "ci".
        id:
          type: string
          title: id
        display:
          type: string
          title: display
          description: display is a human-readable name; never an email address.
      title: Actor
      additionalProperties: false
      description: Actor is who performed an action.
    plux.v1.AddMemberRequest:
      type: object
      properties:
        organizationId:
          type: string
          title: organization_id
        teamId:
          type: string
          title: team_id
        email:
          type: string
          title: email
        role:
          type: string
          title: role
      title: AddMemberRequest
      additionalProperties: false
    plux.v1.AddMemberResponse:
      type: object
      properties:
        member:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Member'
          title: member
        invitation:
          type: string
          title: invitation
          description: |-
            invitation is set when the account was created; it is returned
             exactly once and expires after seven days.
      title: AddMemberResponse
      additionalProperties: false
    plux.v1.AndroidEvidence:
      type: object
      properties:
        keyAttestationChain:
          type: array
          items:
            type: string
            format: byte
          title: key_attestation_chain
          description: |-
            key_attestation_chain is the X.509 certificate chain of the Android
             Key Attestation for the DPoP key, leaf first, DER-encoded.
        playIntegrityToken:
          type: string
          title: play_integrity_token
          description: |-
            play_integrity_token is the Play Integrity verdict token, bound to
             the challenge.
      title: AndroidEvidence
      additionalProperties: false
      description: AndroidEvidence is the proof an Android device offers (SEC-003).
    plux.v1.App:
      type: object
      properties:
        id:
          type: string
          title: id
        organizationId:
          type: string
          title: organization_id
        key:
          type: string
          title: key
        name:
          type: string
          title: name
        defaultPluginKey:
          type: string
          title: default_plugin_key
          description: default_plugin_key is the plugin whose entry page the app opens.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
      title: App
      additionalProperties: false
    plux.v1.ApproveDeviceAuthorizationRequest:
      type: object
      properties:
        userCode:
          type: string
          title: user_code
        organizationId:
          type: string
          title: organization_id
      title: ApproveDeviceAuthorizationRequest
      additionalProperties: false
    plux.v1.ApproveDeviceAuthorizationResponse:
      type: object
      title: ApproveDeviceAuthorizationResponse
      additionalProperties: false
    plux.v1.Artifact:
      type: object
      properties:
        sha256:
          type: string
          title: sha256
          description: sha256 is the hash of the artifact's bytes, lower-case hex.
        size:
          type: string
          title: size
          format: int64
        urls:
          type: array
          items:
            type: string
          title: urls
          description: urls are the locations to fetch it from, most preferred first.
        mediaType:
          type: string
          title: media_type
          description: media_type is the artifact's media type.
      title: Artifact
      additionalProperties: false
      description: Artifact is a stored, content-addressed object (SRV-023, REL-024).
    plux.v1.Asset:
      type: object
      properties:
        id:
          type: string
          title: id
        appId:
          type: string
          title: app_id
        pluginId:
          type: string
          title: plugin_id
          description: plugin_id is empty for an app-level asset.
        name:
          type: string
          title: name
        mediaType:
          type: string
          title: media_type
          description: media_type is what sniffing determined, not what the caller claimed.
        size:
          type: string
          title: size
          format: int64
        sha256:
          type: string
          title: sha256
        width:
          type: integer
          title: width
          format: int32
          description: width and height are set for raster and vector images.
        height:
          type: integer
          title: height
          format: int32
        variants:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.AssetVariant'
          title: variants
          description: variants are the processed forms, such as WebP at 1x, 2x and 3x.
        processing:
          type: string
          title: processing
          description: processing is "pending", "ready" or "failed".
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.Diagnostic'
          title: diagnostics
        uploadedBy:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Actor'
          title: uploaded_by
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
      title: Asset
      additionalProperties: false
    plux.v1.AssetVariant:
      type: object
      properties:
        kind:
          type: string
          title: kind
          description: kind is "webp", "avif", "png", "dotlottie", "original" or "vector".
        density:
          type: integer
          title: density
          format: int32
          description: density is 1, 2 or 3 for raster variants; zero otherwise.
        artifact:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Artifact'
          title: artifact
        width:
          type: integer
          title: width
          format: int32
        height:
          type: integer
          title: height
          format: int32
      title: AssetVariant
      additionalProperties: false
      description: AssetVariant is one processed form of an asset (CMP-030, CMP-033).
    plux.v1.AttestationEvidence:
      type: object
      anyOf:
        - type: object
          properties:
            android:
              allOf:
                - $ref: '#/components/schemas/plux.v1.AndroidEvidence'
              title: android
          title: android
        - type: object
          properties:
            development:
              allOf:
                - $ref: '#/components/schemas/plux.v1.DevelopmentEvidence'
              title: development
          title: development
        - type: object
          properties:
            ios:
              allOf:
                - $ref: '#/components/schemas/plux.v1.IosEvidence'
              title: ios
          title: ios
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - android
              - required:
                  - development
              - required:
                  - ios
          - not:
              oneOf:
                - required:
                    - android
                - required:
                    - development
                - required:
                    - ios
      title: AttestationEvidence
      description: |-
        AttestationEvidence is the platform evidence for one key: exactly one
         of the provider forms (SEC-003, SEC-004).
    plux.v1.AttestationSummary:
      type: object
      properties:
        provider:
          type: string
          title: provider
          description: |-
            provider is "key_attestation", "play_integrity", "app_attest" or
             "development".
        verifiedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: verified_at
          description: verified_at is when the server last verified the evidence.
        verdicts:
          type: array
          items:
            type: string
          title: verdicts
          description: |-
            verdicts are the provider's verdicts the server accepted, such as
             "MEETS_STRONG_INTEGRITY".
        riskMetric:
          type: integer
          title: risk_metric
          format: int32
          description: |-
            risk_metric is the provider's risk figure, such as App Attest's
             receipt risk metric; zero when the provider reports none.
      title: AttestationSummary
      additionalProperties: false
      description: |-
        AttestationSummary is what the server keeps of a verified attestation
         (SEC-003). It carries verdicts, never the raw evidence.
    plux.v1.AuditCheckpoint:
      type: object
      properties:
        sequence:
          type: string
          title: sequence
          format: int64
          description: |-
            sequence is the sequence number of the last entry the checkpoint
             covers.
        entryHash:
          type: string
          title: entry_hash
          format: byte
          description: entry_hash is the chain hash at that entry.
        signature:
          type: string
          title: signature
          format: byte
          description: signature signs sequence and entry_hash.
        keyId:
          type: string
          title: key_id
          description: key_id identifies the audit signing key.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
      title: AuditCheckpoint
      additionalProperties: false
      description: |-
        AuditCheckpoint is a signed point in the audit log's hash chain
         (SEC-141).
    plux.v1.AuditEntry:
      type: object
      properties:
        id:
          type: string
          title: id
        time:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: time
        actor:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Actor'
          title: actor
        action:
          type: string
          title: action
          description: action is the registered action name, such as "plugin.lock.override".
        targetKind:
          type: string
          title: target_kind
          description: target_kind and target_id identify what the action was performed on.
        targetId:
          type: string
          title: target_id
        sourceIp:
          type: string
          title: source_ip
        userAgent:
          type: string
          title: user_agent
        requestId:
          type: string
          title: request_id
        beforeHash:
          type: string
          title: before_hash
          description: before_hash and after_hash are SHA-256 of the affected content.
        afterHash:
          type: string
          title: after_hash
      title: AuditEntry
      additionalProperties: false
      description: AuditEntry is one record of the append-only audit log (SEC-140).
    plux.v1.BeginWebAuthnLoginRequest:
      type: object
      properties:
        challengeId:
          type: string
          title: challenge_id
      title: BeginWebAuthnLoginRequest
      additionalProperties: false
    plux.v1.BeginWebAuthnLoginResponse:
      type: object
      properties:
        optionsJson:
          type: string
          title: options_json
          format: byte
          description: |-
            options_json is PublicKeyCredentialRequestOptions in WebAuthn's JSON
             serialisation, for navigator.credentials.get().
      title: BeginWebAuthnLoginResponse
      additionalProperties: false
    plux.v1.BeginWebAuthnRegistrationRequest:
      type: object
      properties:
        label:
          type: string
          title: label
      title: BeginWebAuthnRegistrationRequest
      additionalProperties: false
    plux.v1.BeginWebAuthnRegistrationResponse:
      type: object
      properties:
        factor:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Factor'
          title: factor
        optionsJson:
          type: string
          title: options_json
          format: byte
          description: |-
            options_json is PublicKeyCredentialCreationOptions in WebAuthn's
             JSON serialisation, for navigator.credentials.create().
      title: BeginWebAuthnRegistrationResponse
      additionalProperties: false
    plux.v1.BundleDescriptor:
      type: object
      properties:
        sha256:
          type: string
          title: sha256
          description: sha256 is the bundle hash the device must end up with (BND-005).
        size:
          type: string
          title: size
          format: int64
        requiredFeatures:
          type: array
          items:
            type: string
          title: required_features
        minRuntime:
          type: string
          title: min_runtime
        url:
          type: string
          title: url
          description: url is where the full bundle can be fetched.
        sync:
          allOf:
            - $ref: '#/components/schemas/plux.v1.SyncStep'
          title: sync
          description: sync names how this device gets from what it has to this bundle.
      title: BundleDescriptor
      additionalProperties: false
    plux.v1.CallRequest:
      type: object
      properties:
        upstream:
          type: string
          title: upstream
          description: |-
            upstream names a configured upstream of the device's app and
             environment (SEC-030).
        operation:
          type: string
          title: operation
          description: |-
            operation names the allowed operation, so the server can apply its
             policy and require a transaction confirmation where one is set
             (SEC-031).
        method:
          type: string
          title: method
          description: method is the HTTP method.
        path:
          type: string
          title: path
          description: |-
            path is the request path and query, relative to the upstream's base
             URL.
        headers:
          type: object
          title: headers
          additionalProperties:
            type: string
            title: value
          description: |-
            headers are the request headers the upstream may receive; the server
             drops any it does not allow (SEC-031).
        body:
          type: string
          title: body
          format: byte
          description: body is the request body.
        transactionChallengeId:
          type: string
          title: transaction_challenge_id
          description: |-
            transaction_challenge_id names the challenge from
             ScaService.CreateTransactionChallenge that transaction_signature
             answers; empty for an operation that needs no confirmation
             (SEC-032).
        transactionSignature:
          type: string
          title: transaction_signature
          format: byte
          description: |-
            transaction_signature is the signature of the device's SCA key over
             the challenge and the transaction summary (SEC-032).
      title: CallRequest
      additionalProperties: false
    plux.v1.CallResponse:
      type: object
      properties:
        status:
          type: integer
          title: status
          format: int32
          description: status is the upstream's HTTP status code.
        headers:
          type: object
          title: headers
          additionalProperties:
            type: string
            title: value
          description: headers are the response headers the server passes on.
        body:
          type: string
          title: body
          format: byte
          description: body is the upstream's response body.
      title: CallResponse
      additionalProperties: false
    plux.v1.CancelPublishJobRequest:
      type: object
      properties:
        jobId:
          type: string
          title: job_id
