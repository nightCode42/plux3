<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="t d">
  <title id="t">Screen editor layout</title>
  <desc id="d">A canvas fills the window. A floating action bar sits at the top centre. A floating panel on the left holds Insert, Layers, Screens, Assets, State and Data. A floating panel on the right holds Properties, Actions, JSON, Code, Localisation, Accessibility and Performance. A bottom drawer holds Problems, Logs, Process flow, State, Network, Functions, Sync, Performance and Console. Screens on the canvas are linked by arrows to a ghost screen from another plugin and a native node.</desc>
  <defs>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F1222" flood-opacity="0.10"/></filter>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5B3DF5"/></marker>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#DADDE7"/></pattern>
  </defs>
  <style>
    text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #0F1222; font-size: 13px; }
    .panel { fill: #FFFFFF; stroke: #E4E6EE; }
    .h { font-weight: 600; font-size: 12px; fill: #5A6072; letter-spacing: .05em; }
    .item { fill: #3A4052; }
    .sel { fill: #EEEAFE; }
    .scr { fill: #FFFFFF; stroke: #CFD3E0; }
    .edge { fill: none; stroke: #5B3DF5; stroke-width: 2; }
  </style>
  <rect width="960" height="600" fill="#F7F8FB"/>
  <rect width="960" height="600" fill="url(#g)"/>
  <!-- canvas content -->
  <rect class="scr" x="300" y="120" width="110" height="200" rx="16"/><text x="355" y="340" text-anchor="middle">Screen A</text>
  <rect class="scr" x="450" y="120" width="110" height="200" rx="16"/><text x="505" y="340" text-anchor="middle">Screen B</text>
  <rect x="600" y="150" width="90" height="150" rx="14" fill="#FFFFFF" fill-opacity=".5" stroke="#9AA1B5" stroke-dasharray="6 5"/><text x="645" y="222" text-anchor="middle" style="fill:#5A6072">Cards ›</text><text x="645" y="240" text-anchor="middle" style="fill:#5A6072">Details</text>
  <path class="edge" d="M410 220 L 448 220" marker-end="url(#a)"/>
  <path class="edge" d="M560 220 L 598 222" marker-end="url(#a)" stroke-dasharray="5 4"/>
  <!-- top bar -->
  <rect class="panel" x="230" y="20" width="500" height="44" rx="22" filter="url(#s)"/>
  <text x="252" y="47" class="item">Undo · Redo · 100% · Pixel 8 · Light · en · Device · AI</text>
  <rect x="644" y="28" width="76" height="28" rx="14" fill="#5B3DF5"/><text x="682" y="47" text-anchor="middle" style="fill:#fff;font-weight:600">Publish</text>
  <!-- left panel -->
  <rect class="panel" x="20" y="90" width="190" height="330" rx="20" filter="url(#s)"/>
  <text class="h" x="40" y="120">LEFT PANEL</text>
  <rect class="sel" x="32" y="134" width="166" height="28" rx="10"/>
  <text class="item" x="44" y="153">Insert</text><text class="item" x="44" y="187">Layers</text><text class="item" x="44" y="217">Screens</text><text class="item" x="44" y="247">Assets</text><text class="item" x="44" y="277">State</text><text class="item" x="44" y="307">Data</text><text class="item" x="44" y="337">Selection</text>
  <!-- right panel -->
  <rect class="panel" x="750" y="90" width="190" height="330" rx="20" filter="url(#s)"/>
  <text class="h" x="770" y="120">RIGHT PANEL</text>
  <rect class="sel" x="762" y="134" width="166" height="28" rx="10"/>
  <text class="item" x="774" y="153">Properties</text><text class="item" x="774" y="187">Actions</text><text class="item" x="774" y="217">JSON ⤢</text><text class="item" x="774" y="247">Code ⤢</text><text class="item" x="774" y="277">Localisation ⤢</text><text class="item" x="774" y="307">Accessibility</text><text class="item" x="774" y="337">Performance</text>
  <text x="774" y="395" style="fill:#5A6072;font-size:12px">⤢ opens a full-screen overlay</text>
  <!-- bottom drawer -->
  <rect class="panel" x="20" y="450" width="920" height="130" rx="20" filter="url(#s)"/>
  <text class="h" x="40" y="478">BOTTOM DRAWER — LIVE FROM PAIRED DEVICE</text>
  <text class="item" x="40" y="508">Problems · Logs · Process flow · State · Network · Functions · Sync · Performance · Console</text>
  <rect x="40" y="524" width="880" height="36" rx="10" fill="#F2F3F8"/>
  <text x="56" y="547" style="fill:#5A6072;font-size:12px">onTap Calculate → invokeFunction loan.calculateSchedule (18 ms) → setState page.result → trackEvent</text>
</svg>
