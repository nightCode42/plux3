name: plux_flutter
description: >-
  The Plux runtime for Flutter. Syncs signed plugin bundles with delta
  updates and renders them as native widgets.
version: 0.0.1
repository: https://github.com/nightCode42/plux3
publish_to: none # Published from Phase 3 (CI-005).

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  code_assets: 1.2.1
  crypto: 3.0.7
  cryptography: 2.9.0
  flat_buffers: 25.9.23
  flutter:
    sdk: flutter
  hooks: 2.2.0
  native_toolchain_c: 0.19.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
