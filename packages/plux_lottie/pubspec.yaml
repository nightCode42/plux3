name: plux_lottie
description: >-
  A Lottie and dotLottie animation widget for Plux pages: a native slot that
  plays a vector animation from a URL, controlled by props (ANI-005, WGT-021).
version: 0.1.0
repository: https://github.com/nightCode42/plux3/tree/main/packages/plux_lottie
# Not published until its release is wired (release.yml, pub.dev).
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  lottie: ^3.6.1
  plux_flutter: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
