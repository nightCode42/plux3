name: plux_scanner
description: >-
  Scan QR codes and barcodes from Plux plugins: the scanCode action, on
  mobile_scanner (ML Kit on Android).
version: 0.1.0
repository: https://github.com/nightCode42/plux3/tree/main/packages/plux_scanner
# Not published until its release is wired (release.yml, pub.dev).
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  mobile_scanner: ^7.4.2
  plux_flutter: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
