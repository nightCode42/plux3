name: plux_svgc
description: >-
  The server's SVG compiler: reads one SVG and writes its vector_graphics
  encoding (CMP-031, ADR-0027 Revision). Built ahead of time into the
  plux-svgc executable the publish worker runs; never a dependency of a
  shipped package.
version: 0.0.1
repository: https://github.com/nightCode42/plux3
publish_to: none

environment:
  sdk: ^3.13.0


dependencies:
  vector_graphics_compiler: 1.3.0

dev_dependencies:
  flutter_lints: ^6.0.0
  test: ^1.26.0
  vector_graphics_codec: ^1.1.13
