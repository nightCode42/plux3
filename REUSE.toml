# Licensing and copyright information for every file, per the REUSE
# specification (https://reuse.software). Checked in CI with `reuse lint`.
# The model is recorded in docs/adr/0022-open-core-licensing.md:
#   - Apache-2.0 by default: runtime packages, CLI, schema, tools, SDKs, docs;
#   - AGPL-3.0-only for the server and Studio;
#   - a commercial license for ee/ (from Phase 9).
# Source files also carry SPDX headers; the entries below cover files that
# cannot (lockfiles, JSON, images) and pin the licence of whole components.

version = 1
SPDX-PackageName = "Plux"
SPDX-PackageSupplier = "Plux contributors"
SPDX-PackageDownloadLocation = "https://github.com/nightCode42/plux3"

[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Plux contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
    "backend/cmd/plux-server/**",
    # Generated by sqlc from the server's own migrations and queries; it
    # has no header of its own, and it is server code (ADR-0022).
    "backend/internal/storage/dbgen/**",
    "studio/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Plux contributors"
SPDX-License-Identifier = "AGPL-3.0-only"

# The WebAssembly image codecs (ADR-0027): libwebp, and libavif with
# libaom, compiled by codecs/build.sh and linked with wasi-libc. Their
# notices are in codecs/THIRD_PARTY_NOTICES.txt, which travels with them.
[[annotations]]
path = "backend/internal/compiler/media/codecs/webp.wasm"
precedence = "override"
SPDX-FileCopyrightText = ["2010 Google Inc.", "2026 Plux contributors"]
SPDX-License-Identifier = "BSD-3-Clause AND LicenseRef-WebM-Patent-Grant AND MIT AND Apache-2.0"

[[annotations]]
path = "backend/internal/compiler/media/codecs/avif.wasm"
precedence = "override"
SPDX-FileCopyrightText = ["2016 Alliance for Open Media", "2019 Joe Drago", "2026 Plux contributors"]
SPDX-License-Identifier = "BSD-2-Clause AND LicenseRef-AOM-Patent-License-1.0 AND MIT AND Apache-2.0"

[[annotations]]
path = "backend/internal/compiler/media/codecs/THIRD_PARTY_NOTICES.txt"
precedence = "override"
SPDX-FileCopyrightText = ["2010 Google Inc.", "2016 Alliance for Open Media", "2019 Joe Drago"]
SPDX-License-Identifier = "BSD-3-Clause AND BSD-2-Clause AND LicenseRef-WebM-Patent-Grant AND LicenseRef-AOM-Patent-License-1.0"
