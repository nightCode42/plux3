# Licensing and copyright information for every file, per the REUSE
# specification (https://reuse.software). Checked in CI with `reuse lint`.
# The model is recorded in docs/adr/0022-open-core-licensing.md:
#   - Apache-2.0 by default: runtime packages, CLI, schema, tools, SDKs, docs;
#   - AGPL-3.0-only for the server and Studio;
#   - a commercial license for ee/ (from Phase 9).
# Source files also carry SPDX headers; the entries below cover files that
# cannot (lockfiles, JSON, images) and pin the licence of whole components.

version = 1
SPDX-PackageName = "Plux"
SPDX-PackageSupplier = "Plux contributors"
SPDX-PackageDownloadLocation = "https://github.com/nightCode42/plux3"

[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Plux contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
    "backend/cmd/plux-server/**",
    # Generated by sqlc from the server's own migrations and queries; it
    # has no header of its own, and it is server code (ADR-0022).
    "backend/internal/storage/dbgen/**",
    "studio/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Plux contributors"
SPDX-License-Identifier = "AGPL-3.0-only"

# The WebAssembly image codecs (ADR-0027): libwebp, and libavif with
# libaom, compiled by codecs/build.sh and linked with wasi-libc. Their
# notices are in codecs/THIRD_PARTY_NOTICES.txt, which travels with them.
[[annotations]]
path = "backend/internal/compiler/media/codecs/webp.wasm"
precedence = "override"
SPDX-FileCopyrightText = ["2010 Google Inc.", "2026 Plux contributors"]
SPDX-License-Identifier = "BSD-3-Clause AND LicenseRef-WebM-Patent-Grant AND MIT AND Apache-2.0"

[[annotations]]
path = "backend/internal/compiler/media/codecs/avif.wasm"
precedence = "override"
SPDX-FileCopyrightText = ["2016 Alliance for Open Media", "2019 Joe Drago", "2026 Plux contributors"]
SPDX-License-Identifier = "BSD-2-Clause AND LicenseRef-AOM-Patent-License-1.0 AND MIT AND Apache-2.0"

[[annotations]]
path = "backend/internal/compiler/media/codecs/THIRD_PARTY_NOTICES.txt"
precedence = "override"
SPDX-FileCopyrightText = ["2010 Google Inc.", "2016 Alliance for Open Media", "2019 Joe Drago"]
SPDX-License-Identifier = "BSD-3-Clause AND BSD-2-Clause AND LicenseRef-WebM-Patent-Grant AND LicenseRef-AOM-Patent-License-1.0"

# The icon fonts the server subsets (ADR-0032 § Icons), imported verbatim
# at the versions icons.lock pins by backend/internal/icons/fonts/import.sh.
[[annotations]]
path = [
    "backend/internal/icons/fonts/MaterialSymbolsOutlined.ttf",
    "backend/internal/icons/fonts/material.codepoints",
    "backend/internal/icons/fonts/LICENSE-material-design-icons",
]
precedence = "override"
SPDX-FileCopyrightText = "Google LLC"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
    "backend/internal/icons/fonts/CupertinoIcons.ttf",
    "backend/internal/icons/fonts/LICENSE-cupertino-icons",
]
precedence = "override"
SPDX-FileCopyrightText = "2016 Vladimir Kharlampidi"
SPDX-License-Identifier = "MIT"

# Icon names and mirroring flags extracted by import.sh from Flutter's
# CupertinoIcons and Icons classes.
[[annotations]]
path = [
    "backend/internal/icons/fonts/cupertino.codepoints",
    "backend/internal/icons/fonts/mirrored.txt",
]
precedence = "override"
SPDX-FileCopyrightText = "2014 The Flutter Authors"
SPDX-License-Identifier = "BSD-3-Clause"

# zstd v1.5.7, decompression sources only, vendored for the runtime's native
# library (ADR-0030); upstream is dual-licensed and Plux uses it under
# BSD-3-Clause. native/zstd/import.sh re-imports it from the pinned commit.
[[annotations]]
path = [
    "packages/plux_flutter/native/zstd/common/**",
    "packages/plux_flutter/native/zstd/decompress/**",
    "packages/plux_flutter/native/zstd/zstd.h",
    "packages/plux_flutter/native/zstd/zstd_errors.h",
    "packages/plux_flutter/native/zstd/LICENSE",
    "packages/plux_flutter/native/zstd/VERSION",
]
precedence = "override"
SPDX-FileCopyrightText = "Meta Platforms, Inc. and affiliates"
SPDX-License-Identifier = "BSD-3-Clause"

# The starter and reference apps' Android and iOS projects, as `flutter create` wrote
# them from the Flutter SDK's templates (launcher icons and launch images
# included); files Plux changes carry their own headers.
[[annotations]]
path = [
    "apps/starter/android/**", "apps/starter/ios/**", "apps/starter/.metadata",
    "apps/plux_bank/android/**", "apps/plux_bank/ios/**", "apps/plux_bank/.metadata",
    "apps/plux_express/android/**", "apps/plux_express/ios/**", "apps/plux_express/.metadata",
]
precedence = "closest"
SPDX-FileCopyrightText = ["2014 The Flutter Authors", "2026 Plux contributors"]
SPDX-License-Identifier = "BSD-3-Clause"

# Phone-number validation metadata (pxl.phone.v1), derived by tools/cmd/phonemeta
# (make phone-metadata) from libphonenumber's PhoneNumberMetadata.xml at the
# release phone.json records, and the tables and vectors generated from it.
# Vendored data approved by the maintainer (plan p5.md §2.1 B2).
[[annotations]]
path = [
    "schema/pxl/phone.json",
    "schema/testdata/phone/examples.json",
    "backend/internal/pxl/phone/table_gen.go",
    "packages/plux_flutter/lib/src/pxl/phone.g.dart",
]
precedence = "override"
SPDX-FileCopyrightText = ["2009 The Libphonenumber Authors", "2026 Plux contributors"]
SPDX-License-Identifier = "Apache-2.0"
