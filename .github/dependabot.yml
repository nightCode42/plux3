# Dependabot — automated dependency updates (CI-007).
#
# Every manifest in the monorepo is covered; tools/internal/policy fails CI if
# a new module is added without an entry here. Each entry:
#   - groups minor and patch updates into one pull request per ecosystem;
#   - waits out a cooldown, so brand-new releases (the window in which a
#     compromised package is usually caught) are not adopted immediately —
#     security updates are exempt;
#   - uses Conventional Commits messages: "chore(deps): …".
# Merging still requires a pull request with passing checks (CI-009), and new
# dependencies follow docs/engineering/dependencies.md.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directories:
      - "/backend"
      - "/tools"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 30
    commit-message:
      prefix: chore
      include: scope
    groups:
      go:
        update-types: [minor, patch]

  - package-ecosystem: pub
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 30
    commit-message:
      prefix: chore
      include: scope
    groups:
      dart:
        update-types: [minor, patch]

  # plux-svgc, the worker's SVG compiler, resolves outside the workspace
  # (ADR-0027 Revision), so it has its own lockfile.
  - package-ecosystem: pub
    directory: "/packages/plux_svgc"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 30
    commit-message:
      prefix: chore
      include: scope
    groups:
      svgc:
        update-types: [minor, patch]

  - package-ecosystem: bun
    directory: "/studio"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 30
    commit-message:
      prefix: chore
      include: scope
    groups:
      studio:
        update-types: [minor, patch]

  # Container images are pinned by tag and digest; Dependabot proposes the
  # new tag and digest together (SEC-108, DEP-002).
  - package-ecosystem: docker
    directory: "/backend"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 30
    commit-message:
      prefix: chore
      include: scope
    groups:
      images:
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: "/deploy/compose"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 30
    commit-message:
      prefix: chore
      include: scope
    groups:
      compose:
        update-types: [minor, patch]
