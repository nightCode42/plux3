# CI — every quality gate for the monorepo (CI-001, CI-002).
#
# Design (docs/engineering/ci.md):
#   - Toolchain jobs (Go, Dart, Studio) run only when their files change on a
#     pull request, and always on main, on schedule and on manual runs.
#   - Repository jobs (hygiene, secrets, specification, workflows, licensing,
#     links, SBOM) always run; they are fast.
#   - "CI OK" depends on every job and is the single required status check of
#     the main ruleset, so path filtering never blocks a merge.
#   - Every job runs the same Makefile target a developer runs locally.
#   - Compiler output is checked against the goldens on Linux, macOS and
#     Windows (CMP-002); fuzzing runs on a schedule in fuzz.yml.
#   - Actions are pinned to full commit SHAs; permissions are read-only unless
#     a job needs more; checkouts never persist credentials.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    # edited: re-check the PR title after a rename (it becomes the squash commit).
    types: [opened, synchronize, reopened, edited]
  merge_group:
  schedule:
    - cron: "17 5 * * *" # daily: newly published vulnerabilities
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Keep in sync with the pinned versions in the Makefile.
env:
  FLUTTER_VERSION: 3.47.5
  BUN_VERSION: 1.3.11
  PRE_COMMIT_VERSION: 4.6.2
  ZIZMOR_VERSION: 1.30.1
  REUSE_VERSION: 6.2.0

# Every run step is bash with -eo pipefail, so a failing command fails its
# step even when piped (into tee, say); the runner's default shell has no
# pipefail.
defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the files changed by the pull request
    outputs:
      go: ${{ steps.decide.outputs.go }}
      dart: ${{ steps.decide.outputs.dart }}
      studio: ${{ steps.decide.outputs.studio }}
      proto: ${{ steps.decide.outputs.proto }}
      codecs: ${{ steps.decide.outputs.codecs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            shared: &shared
              - Makefile
              - coverage.json
              - tools/**
              - go.work
              - schema/**
              - test/compat/**
              - test/e2e/**
              - test/bench/**
              - test/size/**
              - .github/workflows/ci.yml
            proto:
              - proto/**
              - Makefile
              - .github/workflows/ci.yml
            go:
              - *shared
              - proto/**
              - backend/**
              - deploy/**
              - scripts/release/**
              # plux-svgc and its library are built into the server image.
              - packages/plux_svgc/**
              - .golangci.yml
              # Generated by `make gen`, which go-gen-check reruns (CI-003).
              - packages/**/*.g.dart
              - packages/**/*_generated.dart
              - studio/packages/schema/**
            dart:
              - *shared
              - packages/**
              - apps/**
              - pubspec.yaml
              - pubspec.lock
              - analysis_options.yaml
            studio:
              - *shared
              - studio/**
            codecs:
              - backend/internal/compiler/media/codecs/**
      - name: Decide which toolchains to check
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          GO_CHANGED: ${{ steps.filter.outputs.go }}
          DART_CHANGED: ${{ steps.filter.outputs.dart }}
          STUDIO_CHANGED: ${{ steps.filter.outputs.studio }}
          PROTO_CHANGED: ${{ steps.filter.outputs.proto }}
          CODECS_CHANGED: ${{ steps.filter.outputs.codecs }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            GO_CHANGED=true DART_CHANGED=true STUDIO_CHANGED=true PROTO_CHANGED=true
          fi
          # The codec rebuild takes minutes: it runs when the codecs change,
          # and on the daily and manual runs, but not on every push to main.
          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ]; then CODECS_CHANGED=true; fi
          {
            echo "go=${GO_CHANGED:-false}"
            echo "dart=${DART_CHANGED:-false}"
            echo "studio=${STUDIO_CHANGED:-false}"
            echo "proto=${PROTO_CHANGED:-false}"
            echo "codecs=${CODECS_CHANGED:-false}"
          } >> "$GITHUB_OUTPUT"

  # ── Repository ───────────────────────────────────────────────────────────

  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx install "pre-commit==${PRE_COMMIT_VERSION}"
      - name: File hygiene hooks
        run: make hygiene

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the full history, not just the tip
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false
      - run: make install-gitleaks
      - name: Scan history for secrets
        run: make secrets

  spec:
    name: Specification and traceability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false
      # Verifies: QA-073.
      - name: Specification consistency
        run: make spec-lint
      # Verifies: QA-070.
      - name: Traceability report
        run: make trace
      - name: Publish report
        if: always()
        run: |
          if [ -f reqtrace.md ]; then
            cat reqtrace.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: traceability-report
          path: |
            reqtrace.md
            reqtrace.json
          if-no-files-found: ignore

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false
      - run: make install-actionlint
      - run: pipx install "zizmor==${ZIZMOR_VERSION}"
      - name: actionlint and zizmor
        env:
          GH_TOKEN: ${{ github.token }} # enables zizmor's online audits (read-only)
        run: make workflows-lint

  licensing:
    name: Licensing (REUSE)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx install "reuse==${REUSE_VERSION}"
      - name: REUSE compliance
        run: make reuse-lint

  links:
    name: Documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check relative links and anchors in Markdown
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments --no-progress --exclude-path node_modules "./**/*.md"
          fail: true

  # The documentation site (ADR-0033): Starlight renders docs/ in place;
  # a broken internal link fails the build. pages.yml publishes it.
  docs-site:
    name: Documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Verifies: DX-002.
      - name: Build the site
        run: make docs-site

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: plux.cdx.json
          artifact-name: sbom-cyclonedx.json
          dependency-snapshot: false

  commits:
    name: Commit messages
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pull request title (becomes the squash commit)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/title"
          ./scripts/check-commit-msg.sh "$RUNNER_TEMP/title"
      - name: Every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            ./scripts/check-commit-msg.sh "$RUNNER_TEMP/msg" || { echo "  in commit $sha"; status=1; }
          done
          exit "$status"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # Licences compatible with the open-core model (ADR-0022,
          # docs/engineering/dependencies.md §1).
          allow-licenses: >-
            Apache-2.0, MIT, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0, 0BSD,
            Unlicense, CC0-1.0, Zlib, BlueOak-1.0.0, Python-2.0, OFL-1.1,
            BSL-1.0, Unicode-3.0
          # Dependencies whose licence the action cannot validate: pub.dev
          # reports licences in lower case, some packages report none, and
          # Go's x/ modules add the Go patent grant to BSD-3-Clause, which the
          # action reads as a non-SPDX "AND LicenseRef-…" expression. Each
          # was checked by hand against the package's LICENSE file:
          #   Apache-2.0    clock, material_color_utilities
          #   BSD-3-Clause  the Dart team packages below, golang.org/x/net,
          #                 x/sync, x/sys and x/text
          #                 (plus the Go PATENTS grant, which adds rights)
          #   MIT           node_preamble; yaml is BSD-3-Clause and MIT
          allow-dependencies-licenses: >-
            pkg:golang/golang.org/x/net, pkg:golang/golang.org/x/sync,
            pkg:golang/golang.org/x/sys, pkg:golang/golang.org/x/text,
            pkg:pub/_fe_analyzer_shared, pkg:pub/analyzer, pkg:pub/clock,
            pkg:pub/frontend_server_client, pkg:pub/glob, pkg:pub/io,
            pkg:pub/material_color_utilities, pkg:pub/mime,
            pkg:pub/node_preamble, pkg:pub/path, pkg:pub/pool,
            pkg:pub/pub_semver, pkg:pub/source_maps, pkg:pub/stack_trace,
            pkg:pub/test, pkg:pub/test_api, pkg:pub/test_core,
            pkg:pub/vector_math, pkg:pub/yaml
          comment-summary-in-pr: never

  # ── Go ───────────────────────────────────────────────────────────────────

  go-lint:
    name: Go lint
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the permanent-ID lock is compared with the base commit's
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.mod
            tools/go.mod
      - run: make install-golangci-lint
      - name: Format, lint, tidiness
        run: make go-fmt-check go-lint go-tidy-check
      # flatc is built from source at its pinned commit (ADR-0002); the
      # cache is keyed by the Makefile, which holds the pin.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/plux
          key: flatc-${{ runner.os }}-${{ hashFiles('Makefile') }}
      - run: make install-flatc
      # `make gen` also regenerates the API contract's Go code (ADR-0005)
      # and the server's query code from its SQL (ADR-0007).
      - run: make install-buf install-sqlc
      # Verifies: CI-003, BND-001.
      - name: Generated code is committed
        run: make go-gen-check
      # Verifies: BND-011.
      - name: Permanent IDs are append-only
        env:
          LOCK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: make registry-lock-check LOCK_BASE="$LOCK_BASE"

  api-contract:
    name: API contract
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # buf breaking compares with the last release tag
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod
      - run: make install-buf
      # Verifies: SRV-000, SRV-002.
      - name: Lint, format and breaking-change check
        run: make proto-check

  go-test:
    name: Go test
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # Integration tests run against real infrastructure, never fakes
    # (QA-005). Without PLUX_TEST_DATABASE_URL they skip, so the same
    # command is useful on a developer's machine.
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plux_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLUX_TEST_DATABASE_URL: postgres://plux:plux@127.0.0.1:5432/plux_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.mod
            tools/go.mod
      # The tests connect as a role row-level security binds, as the
      # server must (SRV-022); the image's own user is a superuser.
      - name: Create the application role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d plux_test -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE plux LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'plux'; GRANT CONNECT, CREATE, TEMPORARY ON DATABASE plux_test TO plux; ALTER SCHEMA public OWNER TO plux;"
      # Verifies: QA-001.
      - name: Tests with race detector and coverage floors
        run: make go-cover | tee -a "$GITHUB_STEP_SUMMARY"
      # ubuntu-latest is the reference runner of the timing budgets.
      - name: Compiler timing budgets
        run: make go-budgets | tee -a "$GITHUB_STEP_SUMMARY"

  compose:
    name: Compose stack and integration
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod
      # Verifies: DEP-002.
      - name: Build and start the single-node stack
        run: make compose-up
      - name: The server answers ready
        run: |
          for _ in $(seq 60); do curl -fsS http://127.0.0.1:8080/readyz && exit 0; sleep 2; done
          docker compose -f deploy/compose/compose.yaml logs plux-server; exit 1
      # Verifies: SEC-108.
      - name: The server container is hardened
        run: |
          id=$(docker compose -f deploy/compose/compose.yaml ps -q plux-server)
          docker inspect "$id" --format '{{.Config.User}} {{.HostConfig.ReadonlyRootfs}} {{.HostConfig.CapDrop}} {{.HostConfig.SecurityOpt}}' | tee /dev/stderr |
            grep -Eq '^65532:65532 true \[ALL\] \[no-new-privileges:true\]$'
          if docker compose -f deploy/compose/compose.yaml exec -T plux-server /bin/sh -c true 2>/dev/null; then
            echo "::error::the server image has a shell; it must be distroless"; exit 1
          fi
      # Verifies: QA-005.
      - name: Integration and end-to-end tests against PostgreSQL, SeaweedFS and Valkey
        run: make compose-test
      - name: Stop the stack
        if: always()
        run: docker compose -f deploy/compose/compose.yaml down -v
      # Verifies: CMP-031, CMP-002.
      - name: The shipped SVG compiler reproduces its golden; the image carries its notices
        run: make image-check

  # The release image is multi-arch; its arm64 half builds Skia and
  # plux-svgc natively here, so an arm64 break or a difference in the
  # worker's output between architectures shows before a release.
  image-arm64:
    name: Server image (arm64)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Verifies: CMP-031, CMP-002.
      - name: Build the image; the shipped SVG compiler reproduces the amd64 golden
        run: make image-check

  go-determinism:
    name: Go determinism (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.mod
            tools/go.mod
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: command -v make || choco install make --no-progress
      # Every platform compiles the conformance vectors and projects to the
      # committed goldens, byte for byte.
      - name: Goldens are reproduced
        run: make go-determinism

  go-build:
    name: Go build
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false # reproducibility is checked with cold caches
      - name: Build
        run: make go-build
      # Verifies: CI-006.
      - name: Reproducible build
        run: make go-reproducible

  go-vuln:
    name: Go vulnerabilities
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false
      - run: make install-govulncheck
      - name: govulncheck
        run: make go-vuln

  wasm-codecs:
    name: Image codecs reproduce
    needs: changes
    if: needs.changes.outputs.codecs == 'true'
    runs-on: ubuntu-24.04 # build.sh pins the toolchain of Ubuntu 24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18 libclang-rt-18-dev-wasm32 \
            wasi-libc=0.0~git20230113.4362b18-3 cmake ninja-build
          sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-18 /usr/local/bin/clang++
          sudo ln -sf /usr/bin/wasm-ld-18 /usr/local/bin/wasm-ld
      # Verifies: CMP-030.
      - name: Rebuild the codecs and compare them with codecs.lock
        run: WORK="$RUNNER_TEMP/codecs-work" make wasm-codecs-check WASM_CODECS_OUT="$RUNNER_TEMP/codecs"
      - name: Show how a rebuilt codec differs
        if: failure()
        run: |
          for m in webp avif; do
            committed=backend/internal/compiler/media/codecs/$m.wasm rebuilt="$RUNNER_TEMP/codecs/$m.wasm"
            cmp -s "$committed" "$rebuilt" && continue
            echo "== $m.wasm: committed $(wc -c <"$committed") bytes, rebuilt $(wc -c <"$rebuilt") bytes; first difference:"
            cmp "$committed" "$rebuilt" | head -1 || true
            diff <(strings -n 6 "$committed") <(strings -n 6 "$rebuilt") | head -40 || true
          done
          # The configuration CMake generated, to compare with a local build.
          cd "$RUNNER_TEMP/codecs-work"
          sha256sum aom-build/config/*.h
          grep -E '^#define (CONFIG|HAVE|ARCH)_' aom-build/config/aom_config.h
          grep -E '^(CMAKE_C_COMPILER|CMAKE_AR|CMAKE_RANLIB|CMAKE_C_FLAGS)[:=]' aom-build/CMakeCache.txt avif-build/CMakeCache.txt || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: rebuilt-codecs
          path: ${{ runner.temp }}/codecs/*.wasm
          retention-days: 7

  # ── Dart and Flutter ─────────────────────────────────────────────────────

  dart:
    name: Dart and Flutter
    needs: changes
    if: needs.changes.outputs.dart == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false
      # Verifies: CI-003.
      - name: Lockfile is committed
        run: make dart-lock-check
      - name: Format, analyze, test with coverage floors
        run: make dart-fmt-check dart-analyze dart-cover | tee -a "$GITHUB_STEP_SUMMARY"
      # Verifies: WGT-003.
      - name: Flutter snapshot matches the pinned SDK
        run: make widgets-api-check

  # The starter app's flows against a server built from source, under
  # flutter test on the runner (the device jobs below run them on an
  # emulator and a simulator), and the compatibility matrix against released runtimes
  # and servers, which needs the tags.
  starter-e2e:
    name: Starter app end-to-end
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.dart == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plux_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLUX_TEST_DATABASE_URL: postgres://plux:plux@127.0.0.1:5432/plux_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Create the application role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d plux_test -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE plux LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'plux'; GRANT CONNECT, CREATE, TEMPORARY ON DATABASE plux_test TO plux; ALTER SCHEMA public OWNER TO plux;"
      # Verifies: QA-006, QA-010.
      - name: Starter flows and the compatibility matrix
        run: make compat | tee -a "$GITHUB_STEP_SUMMARY"

  # The same flows on an Android emulator and an iOS simulator, in the app
  # built for the device, with the platform's key store and HTTP client
  # (test/e2e/README.md). No emulator action: the runner's Android SDK
  # tools, and Xcode's simctl.
  e2e-android:
    name: Device end-to-end (Android ${{ matrix.api }}${{ matrix.variant && format(', {0}', matrix.variant) || '' }})
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.dart == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 26: the oldest level current emulators boot; 35: current. API 24,
        # the runtime's minimum (RT-002), never finished booting on current
        # emulators (CI runs 36719678834, 36729487188): two ways to boot it
        # are tried side by side (test/e2e/android.sh, E2E_VARIANT).
        api: [26, 35]
        include:
          - api: 24
            variant: slow
          - api: 24
            variant: emulator
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plux_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLUX_TEST_DATABASE_URL: postgres://plux:plux@127.0.0.1:5432/plux_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Create the application role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d plux_test -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE plux LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'plux'; GRANT CONNECT, CREATE, TEMPORARY ON DATABASE plux_test TO plux; ALTER SCHEMA public OWNER TO plux;"
      # Verifies: QA-006, RT-002.
      - name: Starter flows on the emulator
        env:
          API: ${{ matrix.api }}
          E2E_VARIANT: ${{ matrix.variant }}
        run: make e2e-android ANDROID_API="$API"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-android-${{ matrix.api }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}
          path: build/e2e/
          retention-days: 14

  e2e-ios:
    name: Device end-to-end (iOS)
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.dart == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      PLUX_TEST_DATABASE_URL: postgres://plux:plux@127.0.0.1:5432/plux_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # macOS runners have no service containers: PostgreSQL from Homebrew.
      - name: Start PostgreSQL and create the application role
        run: |
          brew install --quiet postgresql@16
          "$(brew --prefix postgresql@16)/bin/pg_ctl" -D "$RUNNER_TEMP/pg" init -o "--auth=trust --username=postgres" >/dev/null
          "$(brew --prefix postgresql@16)/bin/pg_ctl" -D "$RUNNER_TEMP/pg" -l "$RUNNER_TEMP/pg.log" -o "-k $RUNNER_TEMP -h 127.0.0.1" start
          psql() { "$(brew --prefix postgresql@16)/bin/psql" -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 "$@"; }
          psql -d postgres -c "CREATE DATABASE plux_test;"
          psql -d plux_test -c \
            "CREATE ROLE plux LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'plux'; GRANT CONNECT, CREATE, TEMPORARY ON DATABASE plux_test TO plux; ALTER SCHEMA public OWNER TO plux;"
      # Verifies: QA-006, RT-002.
      - name: Starter flows on the simulator
        run: make e2e-ios
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-ios
          path: build/e2e/
          retention-days: 14

  # ── Benchmarks and size (QA-007) ─────────────────────────────────────────

  # The runtime benchmark in profile mode, on Linux desktop under xvfb:
  # this commit's runtime and the base's run alternately on the same
  # runner, and the job fails when this one is more than 10% slower
  # (docs/benchmarks/p3-runtime.md). Absolute numbers come from the
  # reference devices, not from here.
  bench-runtime:
    name: Runtime benchmark
    needs: changes
    if: needs.changes.outputs.dart == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: tools/go.mod
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install the Linux desktop toolchain and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev xvfb
      - name: Choose the base to compare with
        id: base
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base=$PR_BASE ;;
            merge_group) base=$QUEUE_BASE ;;
            push) base=$BEFORE ;;
            *) base=$(git merge-base HEAD origin/main) ;;
          esac
          # A push that created the branch, or a run on main itself: the
          # parent commit.
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] || [ "$base" = "$(git rev-parse HEAD)" ]; then
            base=$(git rev-parse HEAD~1)
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      # Verifies: QA-007.
      - name: Compare with the base's runtime
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: make bench-runtime-ab BASE="$BASE"
      - name: Report
        if: always()
        run: cat build/bench-runtime/report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bench-runtime
          path: |
            build/bench-runtime/**/*.json
            build/bench-runtime/**/*.log
            build/bench-runtime/report.md
          retention-days: 14

  # The sync benchmark: the runtime syncs the fifty-plugin benchmark app
  # through the spec's slow network against a server built from source.
  bench-sync:
    name: Sync benchmark
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.dart == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plux_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLUX_TEST_DATABASE_URL: postgres://plux:plux@127.0.0.1:5432/plux_test?sslmode=disable
      PLUX_BENCH_SYNC_OUT: ${{ github.workspace }}/bench-sync.md
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Create the application role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d plux_test -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE plux LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'plux'; GRANT CONNECT, CREATE, TEMPORARY ON DATABASE plux_test TO plux; ALTER SCHEMA public OWNER TO plux;"
      # Verifies: QA-007, NFR-007.
      - name: Sync on the simulated slow network
        run: make bench-sync
      - name: Report
        if: always()
        run: cat "$PLUX_BENCH_SYNC_OUT" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

  # What plux_flutter adds to a release build for arm64: the blank app of
  # test/size with and without it (RT-061).
  size-android:
    name: Size (Android)
    needs: changes
    if: needs.changes.outputs.dart == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: tools/go.mod
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Verifies: RT-061, NFR-009.
      - name: Release APK for arm64, blank and with plux_flutter
        run: make size-android
      - name: Report
        if: always()
        run: cat build/size/android.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: size-android
          path: |
            build/size/android.md
            build/size/android-code-size.txt
            build/size/code-size/
          retention-days: 14

  size-ios:
    name: Size (iOS)
    needs: changes
    if: needs.changes.outputs.dart == 'true'
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: tools/go.mod
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Verifies: RT-061, NFR-009.
      - name: Release app for arm64, blank and with plux_flutter, unsigned
        run: make size-ios
      - name: Report
        if: always()
        run: cat build/size/ios.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

  # ── Studio ───────────────────────────────────────────────────────────────

  studio:
    name: Studio
    needs: changes
    if: needs.changes.outputs.studio == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Install (frozen lockfile), lint, type-check, test with coverage floors
        run: make studio-check | tee -a "$GITHUB_STEP_SUMMARY"

  # ── Gate ─────────────────────────────────────────────────────────────────

  ci-ok:
    name: CI OK
    if: always()
    needs:
      - changes
      - hygiene
      - secrets
      - spec
      - workflows
      - licensing
      - links
      - docs-site
      - sbom
      - commits
      - dependency-review
      - go-lint
      - api-contract
      - go-test
      - compose
      - image-arm64
      - wasm-codecs
      - go-determinism
      - go-build
      - go-vuln
      - dart
      - starter-e2e
      - e2e-android
      - e2e-ios
      - bench-runtime
      - bench-sync
      - size-android
      - size-ios
      - studio
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail unless every job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
