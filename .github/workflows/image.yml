# Image — build, push, sign and attest one multi-arch distroless image of
# the backend (DEP-001, SEC-108, CI-004). Called by release.yml for each
# image; the SLSA provenance is generated there from the digest returned.

name: Image

on:
  workflow_call:
    inputs:
      image:
        description: Image name under ghcr.io/<owner>/
        type: string
        required: true
      target:
        description: Target of backend/Dockerfile
        type: string
        required: true
      version:
        description: Release version, without the component prefix
        type: string
        required: true
    outputs:
      name:
        description: Image name without tag or digest
        value: ${{ jobs.image.outputs.name }}
      digest:
        description: Manifest-list digest
        value: ${{ jobs.image.outputs.digest }}

permissions: {}

# Every run step is bash with -eo pipefail, so a failing command fails its
# step even when piped (into tee, say); the runner's default shell has no
# pipefail.
defaults:
  run:
    shell: bash

jobs:
  image:
    name: ${{ inputs.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless cosign signatures
    outputs:
      name: ${{ steps.meta.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image name and build metadata
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ inputs.image }}
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "name=ghcr.io/${OWNER,,}/$IMAGE"
            echo "tag=ghcr.io/${OWNER,,}/$IMAGE:$VERSION"
            echo "commit=$(git rev-parse HEAD)"
            echo "date=$(TZ=UTC0 git log -1 --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd)"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          target: ${{ inputs.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tag }}
          provenance: false # SLSA provenance comes from the generator in release.yml
          sbom: false # attached as a signed CycloneDX attestation below
          build-args: |
            VERSION=${{ inputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            COMMIT_DATE=${{ steps.meta.outputs.date }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.meta.outputs.name }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
      # Verifies: DEP-001, CI-004.
      - name: Sign the image and attest its SBOM
        env:
          REF: ${{ steps.meta.outputs.name }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$REF"
