# Release — publish a GitHub release when the maintainer pushes a component
# tag (CI-008). Tags are `<component>/v<semver>` and must be annotated and
# signed: `git tag -s backend/v0.1.0 -m "backend v0.1.0"`. The maintainer
# creates tags; nothing in CI creates or moves them (docs/engineering/workflow.md §8).
#
# A backend release also ships (DEP-001, CLI-001, CI-004):
#   - reproducible archives of plux and plux-server for six platforms, their
#     SHA256SUMS signed keylessly with cosign, a Homebrew formula and a Scoop
#     manifest, and SLSA v1.0 Build Level 3 provenance for every archive;
#   - multi-arch distroless images of plux-server and plux on GHCR, signed
#     with cosign, with a CycloneDX SBOM attestation and SLSA provenance.
# The SLSA generators are referenced by tag, not commit: they verify their
# own ref to produce Build Level 3 provenance and refuse a commit reference.

name: Release

on:
  push:
    tags:
      - "backend/v*"
      - "plux_flutter/v*"
      - "plux_devtools/v*"
      - "studio/v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GIT_CLIFF_VERSION: 2.14.2
  # Keep in sync with the pinned versions in the Makefile.
  FLUTTER_VERSION: 3.47.5

# Every run step is bash with -eo pipefail, so a failing command fails its
# step even when piped (into tee, say); the runner's default shell has no
# pipefail.
defaults:
  run:
    shell: bash

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub release and upload its assets
      id-token: write # keyless cosign signature of SHA256SUMS
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
      backend: ${{ steps.component.outputs.backend }}
      version: ${{ steps.component.outputs.version }}
      package: ${{ steps.component.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # release notes need every earlier tag
          persist-credentials: false
      - name: Verify the tag is annotated, signed and semantic
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          [[ "$TAG" =~ ^(backend|plux_flutter|plux_devtools|studio)/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error::$TAG is not <component>/v<semver>"; exit 1; }
          ref=$(gh api "repos/$REPO/git/ref/tags/$TAG")
          [ "$(jq -r .object.type <<<"$ref")" = "tag" ] \
            || { echo "::error::$TAG is a lightweight tag; releases need a signed, annotated tag"; exit 1; }
          verified=$(gh api "repos/$REPO/git/tags/$(jq -r .object.sha <<<"$ref")" --jq .verification.verified)
          [ "$verified" = "true" ] \
            || { echo "::error::GitHub could not verify the signature of $TAG"; exit 1; }
      - name: Verify the version matches the component manifest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          component="${TAG%%/v*}" version="${TAG#*/v}"
          if [ "$component" = "plux_flutter" ] || [ "$component" = "plux_devtools" ]; then
            declared=$(sed -n 's/^version: *//p' "packages/$component/pubspec.yaml")
            [ "$declared" = "$version" ] \
              || { echo "::error::pubspec.yaml declares $declared, the tag says $version"; exit 1; }
          fi
      - name: Component
        id: component
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "version=${TAG#*/v}" >> "$GITHUB_OUTPUT"
          if [ "${TAG%%/v*}" = backend ]; then echo "backend=true" >> "$GITHUB_OUTPUT"; fi
          case "${TAG%%/v*}" in plux_flutter | plux_devtools) echo "package=${TAG%%/v*}" >> "$GITHUB_OUTPUT" ;; esac
      - run: pipx install "git-cliff==${GIT_CLIFF_VERSION}"
      # Verifies: DEP-030.
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          make release-notes COMPONENT="${TAG%%/v*}" TAG="$TAG" > "$RUNNER_TEMP/notes.md"
          grep -q '^### Upgrading' "$RUNNER_TEMP/notes.md" \
            || { echo "::error::the release notes have no upgrade steps (DEP-030)"; exit 1; }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.component.outputs.backend == 'true'
        with:
          go-version-file: backend/go.mod
          cache: false # a release is built from a cold cache (CI-006)
      # Verifies: CLI-001.
      - name: Build the release archives
        if: steps.component.outputs.backend == 'true'
        run: make release-binaries
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.component.outputs.backend == 'true'
      # Verifies: CI-004.
      - name: Sign SHA256SUMS
        if: steps.component.outputs.backend == 'true'
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: Hashes for provenance
        id: hashes
        if: steps.component.outputs.backend == 'true'
        run: echo "hashes=$(base64 -w0 dist/SHA256SUMS)" >> "$GITHUB_OUTPUT"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          BACKEND: ${{ steps.component.outputs.backend }}
        run: |
          assets=()
          if [ "$BACKEND" = true ]; then assets=(dist/*); fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "${assets[@]}"

  # A Dart package goes to pub.dev by automated publishing: pub.dev accepts
  # the workflow's OIDC token for a tag matching the package's pattern, so no
  # personal credential exists anywhere (CI-005). setup-dart provisions the
  # token; the pub.dev environment lets the maintainer require an approval.
  pub:
    name: Publish ${{ needs.release.outputs.package }} to pub.dev
    needs: release
    if: needs.release.outputs.package != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pub.dev
    permissions:
      contents: read
      id-token: write # the OIDC token pub.dev accepts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false # a publishing job restores no cache
      # Verifies: CI-005.
      - name: Publish
        env:
          PACKAGE: ${{ needs.release.outputs.package }}
        run: |
          flutter pub get
          cd "packages/$PACKAGE"
          dart pub publish --dry-run
          dart pub publish --force

  provenance:
    name: Archive provenance
    needs: release
    if: needs.release.outputs.backend == 'true'
    permissions:
      actions: read # the generator reads the workflow run
      id-token: write # sign the provenance
      contents: write # upload it to the release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses] — must be a tag, see the header
    with:
      base64-subjects: ${{ needs.release.outputs.hashes }}
      upload-assets: true
      upload-tag-name: ${{ github.ref_name }}
      provenance-name: plux.intoto.jsonl

  image-server:
    name: Image plux-server
    needs: release
    if: needs.release.outputs.backend == 'true'
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless cosign signatures
    uses: ./.github/workflows/image.yml # zizmor: ignore[self-repository] — actionlint 1.7.12 does not accept the $/ form yet
    with:
      image: plux-server
      target: server
      version: ${{ needs.release.outputs.version }}

  image-cli:
    name: Image plux
    needs: release
    if: needs.release.outputs.backend == 'true'
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless cosign signatures
    uses: ./.github/workflows/image.yml # zizmor: ignore[self-repository] — actionlint 1.7.12 does not accept the $/ form yet
    with:
      image: plux
      target: cli
      version: ${{ needs.release.outputs.version }}

  provenance-server:
    name: Image provenance plux-server
    needs: image-server
    permissions:
      actions: read # the generator reads the workflow run
      id-token: write # sign the provenance
      packages: write # push it next to the image
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses] — must be a tag, see the header
    with:
      image: ${{ needs.image-server.outputs.name }}
      digest: ${{ needs.image-server.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  provenance-cli:
    name: Image provenance plux
    needs: image-cli
    permissions:
      actions: read # the generator reads the workflow run
      id-token: write # sign the provenance
      packages: write # push it next to the image
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses] — must be a tag, see the header
    with:
      image: ${{ needs.image-cli.outputs.name }}
      digest: ${{ needs.image-cli.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
