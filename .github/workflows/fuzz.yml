# Fuzz — continuous fuzzing of the parsers, the verifier and the compiler
# (QA-004, CMP-052). Every Go fuzz target runs for FUZZTIME on a schedule;
# a failing input is uploaded so it can be added to the target's corpus as
# a regression test (docs/engineering/testing.md §6).

name: Fuzz

on:
  schedule:
    - cron: "41 2 * * *" # nightly
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Time per fuzz target (Go duration)
        default: 5m
        required: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  go-fuzz:
    name: Go fuzz targets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.mod
            tools/go.mod
      # Verifies: QA-004, CMP-052.
      - name: Fuzz every target
        env:
          FUZZTIME: ${{ inputs.fuzztime || '5m' }}
        run: make go-fuzz FUZZTIME="$FUZZTIME"
      - name: Keep failing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-failures
          path: "**/testdata/fuzz/**"
          retention-days: 30
