name: plux_starter
description: >-
  The minimal host app of the Plux quick start: it initializes the runtime,
  shows a published page inside a native screen and opens it full screen,
  and is what the end-to-end tests drive on emulators and simulators.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  plux_devtools: ^0.1.0
  plux_flutter: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # The baseline `plux pull` writes (SYN-007); asset directories are not
  # recursive, so each of its directories is listed.
  assets:
    - assets/plux/
    - assets/plux/bundles/
    - assets/plux/assets/
