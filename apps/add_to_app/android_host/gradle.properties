org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# The Flutter Gradle plugin, which builds the module, needs the Android
# Gradle plugin's earlier DSL and the Kotlin Gradle plugin, as in the
# Flutter templates.
android.newDsl=false
android.builtInKotlin=false
# Play Services Cronet, which cronet_http uses for HTTP/2 (SYN-010), brings
# cronet-api and cronet-shared, which declare one namespace; the Android
# Gradle plugin 9 refuses that unless unique package names are off.
android.uniquePackageNames=false
