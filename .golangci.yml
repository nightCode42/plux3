# golangci-lint v2 configuration, shared by every Go module in the repository.
# Docs: https://golangci-lint.run/docs/configuration/
# Rules and size limits: docs/engineering/go-standards.md.

version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - funlen
    - gocognit
    - gocritic
    - godot
    - gosec
    - misspell
    - nestif
    - nilerr
    - noctx
    - revive
    - unconvert
    - unparam
    - wrapcheck
  settings:
    # Size and complexity limits: go-standards.md §5.
    funlen:
      lines: 80
      statements: 50
      ignore-comments: true
    gocognit:
      min-complexity: 20
    nestif:
      min-complexity: 5
    misspell:
      locale: UK
      # Identifiers of the document model keep the specification's spelling
      # (e.g. the `color` type of SCH-010, the `organization` scope); prose
      # stays British.
      ignore-rules:
        - color
        - organization
    wrapcheck:
      # Errors crossing a package boundary are wrapped with context.
      ignore-sig-regexps:
        - fmt\.Errorf\(
        - errors\.Join\(
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: receiver-naming
        - name: unused-receiver
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Tests may be long and table-heavy; readability is enforced in review.
      # Errors in test helpers end the test, so wrapping adds nothing.
      - path: _test\.go
        linters:
          - funlen
          - gocognit
          - wrapcheck
      # Repository tooling reads files named on its own command line.
      - path: ^tools/
        linters:
          - gosec
        text: "G304"
      # Tests read and write fixtures in the repository and in temporary
      # directories.
      - path: _test\.go
        linters:
          - gosec
        text: "G304|G703|G122"

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/nightCode42/plux3
